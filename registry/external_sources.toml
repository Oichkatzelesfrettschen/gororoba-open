body_markdown = '''
# Sedenion Zero-Divisor Experimental Connections

Extracted from conversation logs (compass artifact wf-7f987cff, the
"Directus Maximalus" ZD math audit) and cross-referenced against the
codebase implementations and primary sources.

## 1. Primary Sources

### Reggiani (2024)
- Silvio Reggiani, "The geometry of sedenion zero divisors"
- arXiv:2411.18881 (November 2024)
- Code: https://github.com/silvioreggiani/sedenion-zero-div

### Moreno (1998)
- Guillermo Moreno, "The zero divisors of the Cayley-Dickson algebras
  over the real numbers"
- Bol. Soc. Mat. Mex. III Ser. 4(1): 13-28 (1998)
- arXiv:q-alg/9710013

## 2. Verified Results

### ZD(S) isometric to V_2(R^7) [Reggiani 2024]

    ZD(S) = { u in S : ||u||^2 = 2, exists v with uv = 0 }

ZD(S) is isometric (not just homeomorphic) to the Stiefel manifold
V_2(R^7), equivalently G_2 / SU(2), with a specific G_2-invariant metric.

Dimension: dim V_2(R^7) = 7*2 - 2*3/2 = 11
Codimension in S^15: 15 - 11 = 4 (matches annihilator dimension)

### Z(S) homeomorphic to G_2 [Moreno 1998]

    Z(S) = { (u,v) in S x S : ||u|| = ||v|| = sqrt(2), uv = 0 }

| Set   | Elements       | dim | Topology   |
|-------|----------------|-----|------------|
| Z(S)  | Pairs (u,v)    | 14  | G_2        |
| ZD(S) | Single u       | 11  | V_2(R^7)   |

The SU(2) fiber (dim 3) accounts for the 14 - 11 = 3 difference.

## 3. Computational Verification (in codebase)

| Result                          | Module           | Status   |
|---------------------------------|------------------|----------|
| 84 standard ZDs, norm^2=2       | reggiani.rs      | VERIFIED |
| Annihilator dim = 4 for all 84  | annihilator.rs   | VERIFIED |
| 4 standard partners per ZD      | reggiani.rs      | VERIFIED |
| Partners span Ann_L(u)          | reggiani.rs      | VERIFIED |
| Grassmannian distances Gr(4,16) | grassmannian.rs  | VERIFIED |
| 5 distinct distance values       | CSV data         | VERIFIED |
| Box-kite distance stratification | grassmannian.rs  | VERIFIED |
| Sign-variant orthogonality      | grassmannian.rs  | VERIFIED |
| ZD(S) ~ V_2(R^7) isometry      | --               | NOT REPLICATED |
| Z(S) ~ G_2 homeomorphism       | --               | NOT REPLICATED |

### Discrepancy: 5 vs 6 distinct distances

Rust computation finds 5 distinct geodesic distance values among 42
same-sign subspaces; Reggiani claims 6. Possible causes: convention
differences, tolerance binning, or sign-variant interpretation correction.

### Sign-variant correction

Early Python analysis (2026-01-30): 42 distinct subspaces (sign variants
share subspaces). Later Rust analysis (2026-02-06): sign variants have
ORTHOGONAL annihilators (distance = pi in Gr(4,16)). The Rust result
(84 distinct subspaces) supersedes.

### Box-kite stratification (novel finding)

Within same box-kite: mean Grassmannian distance = 2.7735
Across box-kites: mean distance = 2.2092
Delta = 0.5643 (counterintuitive: within > across)

## 4. Division Algebra-to-Physics Programs

From the audit, verified as ACTIVE research programs:

| Program                    | Status      | Key Result                              |
|----------------------------|-------------|-----------------------------------------|
| Furey (2024-2025)          | ACTIVE      | 3 SM generations via triality           |
| Dubois-Violette & Todorov  | ESTABLISHED | S(U(2)xU(3)) from F_4 = Aut(H_3(O))   |
| Gresnigt (2023-2025)       | ACTIVE      | S_3 subset Aut(S) -> 3-gen structure    |
| G_2 holonomy + sedenions   | NOT FOUND   | No physics connection in literature     |

## 5. Open Items

- FT-3.1 (ZD(S) ~ V_2(R^7)): requires fiber bundle transition functions
- PSL(2,7) action: |PSL(2,7)| = 168 verified; explicit group action on
  box-kites not yet replicated in code
- Moreno (2005) higher-dim generalization (math/0512517): V_{2^{n-1}, 2}
  relationship to Reggiani's V_2(R^7) needs investigation

## Source

Audit content from "Directus Maximalus" compass artifact, cross-validated
against primary papers and Rust implementations.
'''


2. Spectral triple verification (Hausdorff vs spectral dimension)
3. Exact functoriality (strict functor vs inherent A_infinity relaxation)
4. p-Adic deformations and gauge representation theory
5. Pre-CD algebraics: classify when o_theta is isotopic to native product

## Critical Assessment

- "Negative-dimensional division algebras" are NOT a standard notion.

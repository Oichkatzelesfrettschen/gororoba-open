name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Validate the complete workspace and dependency policy
        type: boolean
        default: false
  # Pull requests run routed compile, tests, governance and docs. Nightly adds
  # the full workspace and paper; weekly adds proofs, the unsafe survey,
  # benchmarks, the Casimir audit and certificates.
  schedule:
    - cron: '17 6 * * *'
    - cron: '23 5 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo-home
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/gate-target
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_VALIDATION_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  validation-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      benchmark: ${{ steps.components.outputs.benchmark }}
      proofs: ${{ steps.components.outputs.proofs }}
      paper: ${{ steps.components.outputs.paper }}
      unsafe_survey: ${{ steps.components.outputs.unsafe_survey }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route independently executable component evidence
        id: components
        continue-on-error: true
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          FULL_COMPONENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
        run: |
          set -euo pipefail
          component_outputs="$RUNNER_TEMP/component-outputs"
          route_components() {
            if [ "$EVENT_NAME" = pull_request ]; then
              printf 'benchmark=false\nproofs=false\npaper=false\nunsafe_survey=false\n' > "$component_outputs"
              return
            fi
            if [ "$EVENT_NAME" = schedule ]; then
              if [ "$EVENT_SCHEDULE" = '23 5 * * 1' ]; then
                printf 'benchmark=true\nproofs=true\npaper=true\nunsafe_survey=true\n' > "$component_outputs"
              else
                printf 'benchmark=false\nproofs=false\npaper=true\nunsafe_survey=false\n' > "$component_outputs"
              fi
              return
            fi
            if [ "$FULL_COMPONENTS" = true ]; then
              printf 'benchmark=true\nproofs=true\npaper=true\nunsafe_survey=true\n' > "$component_outputs"
              return
            fi
            comparison_base="$EVENT_BASE"
            if [ -z "$comparison_base" ] || [ "$comparison_base" = 0000000000000000000000000000000000000000 ]; then
              comparison_base="$(git rev-parse HEAD^)"
            fi
            git cat-file -e "$comparison_base^{commit}"
            git diff --no-renames --name-only "$comparison_base" HEAD > "$RUNNER_TEMP/component-changed-paths"
            for component in benchmark proofs paper unsafe_survey; do
              case "$component" in
                benchmark) pattern='^crates/(cd_kernel|fwht|verified_core|gororoba_gpu_bridge)/|^crates/gororoba_cli/src/bin/detect_worker_budget\.rs$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.cargo/config\.toml$|^\.github/workflows/(bench-cd-kernel|ci)\.yml$' ;;
                proofs) pattern='^ci/gororoba_math\.pin$|^registry/canonical/|^plans/vacuum_(energy_falsification|integration_contract)\.toml$|^crates/(provenance_store|provenance_core|repo_root|gororoba_db)/|^crates/gororoba_cli_physics/src/bin/vacuum_response_audit|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.cargo/|^\.github/workflows/(proofs|ci)\.yml$' ;;
                paper) pattern='^docs/latex/|^papers/bib/|^\.github/workflows/(paper|ci)\.yml$' ;;
                unsafe_survey) pattern='^tools/vendor/cargo-geiger/|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.cargo/config\.toml$|^\.github/workflows/(unsafe-survey|ci)\.yml$' ;;
              esac
              if grep -Eq "$pattern" "$RUNNER_TEMP/component-changed-paths"; then
                echo "$component=true" >> "$component_outputs"
              else
                echo "$component=false" >> "$component_outputs"
              fi
            done
          }
          if route_components; then
            cat "$component_outputs" >> "$GITHUB_OUTPUT"
          else
            printf 'benchmark=true\nproofs=true\npaper=true\nunsafe_survey=true\n' >> "$GITHUB_OUTPUT"
            echo "Component routing failed; every independent evidence lane remains selected." >&2
            exit 1
          fi

      - name: Install pinned actionlint release
        id: actionlint-install
        continue-on-error: true
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Validate workflow syntax and embedded shell
        id: actionlint
        if: always()
        continue-on-error: true
        run: actionlint

      - name: Validate CI-only execution and worker boundaries
        id: resource-contract
        if: always()
        continue-on-error: true
        run: make --keep-going validation-resource-contract

      - name: Report collected validation-policy failures
        if: always()
        env:
          ACTIONLINT_INSTALL_OUTCOME: ${{ steps.actionlint-install.outcome }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          COMPONENTS_OUTCOME: ${{ steps.components.outcome }}
          RESOURCE_CONTRACT_OUTCOME: ${{ steps.resource-contract.outcome }}
        run: |
          set -euo pipefail
          failure_count=0
          for outcome_variable in ACTIONLINT_INSTALL_OUTCOME ACTIONLINT_OUTCOME COMPONENTS_OUTCOME RESOURCE_CONTRACT_OUTCOME; do
            outcome="${!outcome_variable}"
            printf '%s=%s\n' "$outcome_variable" "$outcome"
            if [ "$outcome" = failure ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          if [ "$failure_count" -ne 0 ]; then
            echo "Collected $failure_count failing validation-policy lane(s)." >&2
            exit 1
          fi

  validation-core:
    needs: validation-policy
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      dependencies: ${{ steps.paths.outputs.dependencies }}
      warp: ${{ steps.paths.outputs.warp }}
      casimir_audit: ${{ steps.paths.outputs.casimir_audit }}
      certificates: ${{ steps.paths.outputs.certificates }}
      run_rust: ${{ steps.route.outputs.run_rust }}
      run_governance: ${{ steps.route.outputs.run_governance }}
      rust_scope: ${{ steps.route.outputs.rust_scope }}
      clippy_scope: ${{ steps.lint.outputs.rust_scope }}
      rust_matrix: ${{ steps.rust-shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143,sccache@0.15.0
      - name: Install compiler and data dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold glslc libcfitsio-dev libhdf5-dev libfontconfig1-dev libopenblas-dev libblas-dev liblapack-dev pkg-config shellcheck

      - name: Cache Rust dependencies and validation artifacts
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ github.workspace }}/.cache/gate-cbuild
          key: ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-
            ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
            ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-

      - name: Resolve immutable comparison base and worker budget
        id: inputs
        if: always()
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ github.event_name == 'schedule' || inputs.full == true }}
        run: |
          set -euo pipefail
          echo 'DIFF_BASE=' >> "$GITHUB_ENV"
          echo 'full=true' >> "$GITHUB_OUTPUT"
          rustc --edition=2024 -D warnings crates/gororoba_cli/src/bin/detect_worker_budget.rs -o "$RUNNER_TEMP/detect-worker-budget"
          worker_budget="$("$RUNNER_TEMP/detect-worker-budget")"
          echo "Hosted validation uses $worker_budget workers from std::thread::available_parallelism()."
          for variable in CI_WORKER_BUDGET WORKER_BUDGET CARGO_JOBS CARGO_BUILD_JOBS NEXTEST_TEST_THREADS RUST_TEST_THREADS RAYON_THREADS RAYON_NUM_THREADS; do
            echo "$variable=$worker_budget" >> "$GITHUB_ENV"
          done
          if [ "$FULL" = true ]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
          else
            comparison_base="$EVENT_BASE"
            if [ -z "$comparison_base" ] || [ "$comparison_base" = 0000000000000000000000000000000000000000 ]; then
              comparison_base="$(git rev-parse HEAD^)"
            fi
            git cat-file -e "$comparison_base^{commit}"
            echo "DIFF_BASE=$comparison_base" >> "$GITHUB_ENV"
            echo 'full=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare validation report directory
        if: always()
        run: mkdir -p reports/validation

      - name: Classify documentation, dependency and artifact changes
        id: paths
        if: always()
        continue-on-error: true
        env:
          FULL: ${{ steps.inputs.outputs.full }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          # The Casimir audit and certificates run weekly and on push or
          # dispatch, never on pull requests or the nightly schedule.
          weekly_lanes=true
          if [ "$EVENT_NAME" = pull_request ]; then
            weekly_lanes=false
          elif [ "$EVENT_NAME" = schedule ] && [ "$EVENT_SCHEDULE" != '23 5 * * 1' ]; then
            weekly_lanes=false
          fi
          classify_paths() {
            if [ "$FULL" = true ]; then
              printf 'docs=true\ndependencies=true\nwarp=true\ncasimir_audit=%s\ncertificates=%s\n' "$weekly_lanes" "$weekly_lanes" >> "$GITHUB_OUTPUT"
              return
            fi
            git diff --no-renames --name-only "$DIFF_BASE" HEAD > reports/validation/changed-paths.txt
            for lane in docs dependencies warp casimir_audit certificates; do
              if [ "$weekly_lanes" = false ] && { [ "$lane" = casimir_audit ] || [ "$lane" = certificates ]; }; then
                echo "$lane=false" >> "$GITHUB_OUTPUT"
                continue
              fi
              case "$lane" in
                docs) pattern='^docs/book/|^crates/book_docs/|^registry/book_docs\.toml$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^Makefile$|^mk/|^\.cargo/|^\.github/workflows/(ci|docs-publish)\.yml$' ;;
                dependencies) pattern='(^|/)Cargo\.(toml|lock)$|(^|/)deny\.toml$|^rust-toolchain\.toml$|^\.github/workflows/ci\.yml$' ;;
                warp) pattern='^data/h5/|^crates/gororoba_cli_warp/|^crates/data_artifacts_core/|^\.github/workflows/ci\.yml$' ;;
                casimir_audit) pattern='^crates/(gororoba_cli_physics|gororoba_cli_provenance|materials_core|materials_data|provenance_store|quantum_core|stats_core)/|^data/output/audit/casimir-optics-discrimination/|^plans/casimir_optics_discrimination_frontier\.toml$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^Makefile$|^\.cargo/config\.toml$|^\.gitattributes$|^\.github/workflows/ci\.yml$' ;;
                certificates) pattern='^crates/navier_stokes_verify/|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.cargo/config\.toml$|^\.github/workflows/(ci|navier-stokes-certificates)\.yml$' ;;
              esac
              if grep -Eq "$pattern" reports/validation/changed-paths.txt; then
                echo "$lane=true" >> "$GITHUB_OUTPUT"
              else
                echo "$lane=false" >> "$GITHUB_OUTPUT"
              fi
            done
          }
          if ! classify_paths; then
            printf 'docs=true\ndependencies=true\nwarp=true\ncasimir_audit=true\ncertificates=true\n' >> "$GITHUB_OUTPUT"
            echo "Path classification failed; all independent path-routed leaves remain scheduled." >&2
            exit 1
          fi

      - name: Build the repository scope router
        id: router-build
        if: always()
        continue-on-error: true
        run: make --jobs="$WORKER_BUDGET" "$CARGO_TARGET_DIR/validation-tools/workspace-routing"

      - name: Route reverse dependency test closure
        id: route
        if: always()
        continue-on-error: true
        env:
          FULL: ${{ steps.inputs.outputs.full }}
        run: |
          set -euo pipefail
          if [ "$FULL" = true ]; then
            printf 'rust_scope=--workspace\nrun_rust=true\nrun_check=true\nrun_governance=true\n' >> "$GITHUB_OUTPUT"
          elif ! "$CARGO_TARGET_DIR/validation-tools/workspace-routing" --base "$DIFF_BASE" --verbose; then
            printf 'rust_scope=--workspace\nrun_rust=true\nrun_check=true\nrun_governance=true\n' >> "$GITHUB_OUTPUT"
            echo "Reverse dependency routing failed; all CI validation surfaces remain scheduled." >&2
            exit 1
          fi

      - name: Route directly changed lint owners
        id: lint
        if: always() && steps.route.outputs.run_rust == 'true'
        continue-on-error: true
        env:
          FULL: ${{ steps.inputs.outputs.full }}
        run: |
          set -euo pipefail
          if [ "$FULL" = true ]; then
            echo 'rust_scope=--workspace' >> "$GITHUB_OUTPUT"
          elif ! "$CARGO_TARGET_DIR/validation-tools/workspace-routing" --base "$DIFF_BASE" --direct-only; then
            echo 'rust_scope=--workspace' >> "$GITHUB_OUTPUT"
            echo "Direct-owner lint routing failed; workspace Clippy remains scheduled." >&2
            exit 1
          fi

      - name: Partition routed Rust tests into job shards
        id: rust-shards
        if: always() && steps.route.outputs.run_rust == 'true'
        continue-on-error: true
        env:
          CI_RUST_SCOPE: ${{ steps.route.outputs.rust_scope }}
          CI_CLIPPY_SCOPE: ${{ steps.lint.outputs.rust_scope }}
        run: |
          set -euo pipefail
          fallback_matrix='{"include":[{"lane":"clippy-fallback","target":"clippy","rust_scope":"","clippy_scope":"--workspace","cargo_target_args":"","cargo_features":""},{"lane":"workspace-fallback","target":"light","rust_scope":"--workspace","clippy_scope":"","cargo_target_args":"--lib --bins --tests --examples","cargo_features":""},{"lane":"heavy-fallback","target":"heavy","rust_scope":"-p algebra_analysis -p gr_core","clippy_scope":"","cargo_target_args":"--lib --bins --tests --examples","cargo_features":""}]}'
          if ! make --jobs="$WORKER_BUDGET" "$CARGO_TARGET_DIR/validation-tools/xtask"; then
            printf 'matrix=%s\n' "$fallback_matrix" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! rust_matrix="$("$CARGO_TARGET_DIR/validation-tools/xtask" ci-rust-shard-matrix \
              --rust-scope="$CI_RUST_SCOPE" \
              --clippy-scope="$CI_CLIPPY_SCOPE" \
              --light-shard-count=8 \
              --heavy-package=algebra_analysis \
              --heavy-package=gr_core \
              --target-shard-package=gororoba_cli_physics \
              --target-shard-count=8)"; then
            printf 'matrix=%s\n' "$fallback_matrix" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          printf 'matrix=%s\n' "$rust_matrix" >> "$GITHUB_OUTPUT"

      - name: Check repository hygiene
        id: hygiene
        if: always() && steps.route.outputs.run_check == 'true'
        continue-on-error: true
        run: make --jobs="$WORKER_BUDGET" --keep-going check 2>&1 | tee reports/validation/hygiene.log

      - name: Install dependency policy verifier
        id: dependency-tool
        if: always() && steps.paths.outputs.dependencies == 'true'
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Verify dependency policy
        id: dependencies
        if: always() && steps.paths.outputs.dependencies == 'true'
        continue-on-error: true
        run: make --jobs="$WORKER_BUDGET" --keep-going cargo-deny-check 2>&1 | tee reports/validation/dependencies.log

      - name: Validate retained Warp HDF5 artifacts
        id: warp
        if: always() && steps.paths.outputs.warp == 'true' && hashFiles('data/h5/**/*.h5') != ''
        continue-on-error: true
        run: cargo run --locked --profile validation -p gororoba_cli_warp --features gpu,hdf5-export --bin warp -- acceptance-gate "data/h5/**/*.h5"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-routing-reports
          path: reports/validation/**
          if-no-files-found: warn
          retention-days: 14

      - name: Report collected validation failures
        if: always()
        env:
          PATHS_OUTCOME: ${{ steps.paths.outcome }}
          ROUTER_BUILD_OUTCOME: ${{ steps.router-build.outcome }}
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          RUST_SHARDS_OUTCOME: ${{ steps.rust-shards.outcome }}
          HYGIENE_OUTCOME: ${{ steps.hygiene.outcome }}
          DEPENDENCY_TOOL_OUTCOME: ${{ steps.dependency-tool.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          WARP_OUTCOME: ${{ steps.warp.outcome }}
        run: |
          set -euo pipefail
          failure_count=0
          for outcome_variable in PATHS_OUTCOME ROUTER_BUILD_OUTCOME ROUTE_OUTCOME LINT_OUTCOME RUST_SHARDS_OUTCOME HYGIENE_OUTCOME DEPENDENCY_TOOL_OUTCOME DEPENDENCIES_OUTCOME WARP_OUTCOME; do
            outcome="${!outcome_variable}"
            printf '%s=%s\n' "$outcome_variable" "$outcome"
            if [ "$outcome" = failure ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          if [ "$failure_count" -ne 0 ]; then
            echo "Collected $failure_count failing validation lane(s)." >&2
            exit 1
          fi

      - name: Retain successful core validation artifacts
        # PRs restore main's build trees and publish only bounded compiler entries.
        if: success() && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ github.workspace }}/.cache/gate-cbuild
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  validation-governance:
    needs: validation-core
    if: always() && (needs.validation-core.outputs.run_rust == 'true' || needs.validation-core.outputs.run_governance == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.15.0
      - name: Install governance build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold glslc libcfitsio-dev libhdf5-dev libfontconfig1-dev libopenblas-dev libblas-dev liblapack-dev pkg-config
      - name: Resolve process-visible worker count
        run: |
          set -euo pipefail
          rustc --edition=2024 -D warnings crates/gororoba_cli/src/bin/detect_worker_budget.rs -o "$RUNNER_TEMP/detect-worker-budget"
          worker_budget="$("$RUNNER_TEMP/detect-worker-budget")"
          echo "Hosted governance validation uses $worker_budget workers from std::thread::available_parallelism()."
          for variable in CI_WORKER_BUDGET WORKER_BUDGET CARGO_JOBS CARGO_BUILD_JOBS NEXTEST_TEST_THREADS RUST_TEST_THREADS RAYON_THREADS RAYON_NUM_THREADS; do
            echo "$variable=$worker_budget" >> "$GITHUB_ENV"
          done
      - name: Restore governance build artifacts
        id: governance-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ github.workspace }}/.cache/gate-cbuild
            ${{ env.SCCACHE_DIR }}
          key: governance-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            governance-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-
            governance-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
            ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
      - name: Validate canonical evidence and governance
        id: governance
        if: always() && needs.validation-core.outputs.run_governance == 'true'
        continue-on-error: true
        run: make --jobs="$WORKER_BUDGET" --keep-going validate-ci-registry 2>&1 | tee governance.log
      - name: Verify provider inventory and database schema documentation
        id: integrity
        if: always()
        continue-on-error: true
        run: make --jobs="$WORKER_BUDGET" --keep-going validate-rust-integrity db-schema-drift-check 2>&1 | tee integrity.log
      - name: Record governance compiler cache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats --stats-format=json > governance-sccache.json
      - name: Report collected governance failures
        if: always()
        env:
          GOVERNANCE_OUTCOME: ${{ steps.governance.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
        run: |
          set -euo pipefail
          failure_count=0
          for outcome_variable in GOVERNANCE_OUTCOME INTEGRITY_OUTCOME; do
            outcome="${!outcome_variable}"
            printf '%s=%s\n' "$outcome_variable" "$outcome"
            if [ "$outcome" = failure ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          [ "$failure_count" -eq 0 ]
      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-governance-reports
          path: |
            governance.log
            integrity.log
            governance-sccache.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain governance build artifacts
        if: success() && github.ref == 'refs/heads/main' && steps.governance-cache.outputs.cache-primary-key != '' && steps.governance-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ github.workspace }}/.cache/gate-cbuild
            ${{ env.SCCACHE_DIR }}
          key: ${{ steps.governance-cache.outputs.cache-primary-key }}

  validation-casimir-audit:
    needs: validation-core
    if: always() && needs.validation-core.outputs.casimir_audit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.15.0
      - name: Install Casimir audit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold glslc libcfitsio-dev libhdf5-dev libfontconfig1-dev libopenblas-dev libblas-dev liblapack-dev pkg-config
      - name: Resolve process-visible worker count
        run: |
          set -euo pipefail
          rustc --edition=2024 -D warnings crates/gororoba_cli/src/bin/detect_worker_budget.rs -o "$RUNNER_TEMP/detect-worker-budget"
          worker_budget="$("$RUNNER_TEMP/detect-worker-budget")"
          echo "Hosted Casimir audit validation uses $worker_budget workers from std::thread::available_parallelism()."
          for variable in CI_WORKER_BUDGET WORKER_BUDGET CARGO_JOBS CARGO_BUILD_JOBS NEXTEST_TEST_THREADS RUST_TEST_THREADS RAYON_THREADS RAYON_NUM_THREADS; do
            echo "$variable=$worker_budget" >> "$GITHUB_ENV"
          done
      - name: Restore Casimir audit build artifacts
        id: casimir-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ github.workspace }}/.cache/gate-cbuild
          key: casimir-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            casimir-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-
            casimir-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
            ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
      - name: Verify retained Casimir and optics audit freshness
        run: make --jobs="$WORKER_BUDGET" --keep-going casimir-optics-discrimination-audit-check 2>&1 | tee casimir-optics-discrimination.log
      - name: Upload Casimir audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-casimir-audit-reports
          path: |
            casimir-optics-discrimination.log
            reports/validation/casimir-optics-discrimination-expected/**
          if-no-files-found: warn
          retention-days: 14
      - name: Retain Casimir audit build artifacts
        if: success() && github.ref == 'refs/heads/main' && steps.casimir-cache.outputs.cache-primary-key != '' && steps.casimir-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ github.workspace }}/.cache/gate-cbuild
          key: ${{ steps.casimir-cache.outputs.cache-primary-key }}

  rust-validation:
    needs: validation-core
    if: always() && needs.validation-core.outputs.run_rust == 'true' && needs.validation-core.outputs.rust_matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G
      SCCACHE_LOG: 'sccache::server=debug/Error executing cache write'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validation-core.outputs.rust_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Set private compiler cache diagnostic path
        run: echo "SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache-write-errors.log" >> "$GITHUB_ENV"

      - name: Configure shared compiler cache
        id: compiler-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.15.0

      - name: Install compiler and data dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold glslc libcfitsio-dev libhdf5-dev libfontconfig1-dev libopenblas-dev libblas-dev liblapack-dev pkg-config shellcheck

      - name: Resolve process-visible worker count
        run: |
          set -euo pipefail
          rustc --edition=2024 -D warnings crates/gororoba_cli/src/bin/detect_worker_budget.rs -o "$RUNNER_TEMP/detect-worker-budget"
          worker_budget="$("$RUNNER_TEMP/detect-worker-budget")"
          echo "Hosted Rust ${{ matrix.lane }} validation uses $worker_budget workers from std::thread::available_parallelism().get()."
          for variable in CI_WORKER_BUDGET WORKER_BUDGET CARGO_JOBS CARGO_BUILD_JOBS NEXTEST_TEST_THREADS RUST_TEST_THREADS RAYON_THREADS RAYON_NUM_THREADS; do
            echo "$variable=$worker_budget" >> "$GITHUB_ENV"
          done

      - name: Restore shared routing build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ github.workspace }}/.cache/gate-cbuild
          key: ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-
            ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-
            ci-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-

      - name: Restore shared compiler entries
        id: compiler-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: compiler-content-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-content-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-
            compiler-content-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}-

      - name: Run scoped Rust ${{ matrix.lane }} shard
        timeout-minutes: 80
        env:
          CI_RUST_SCOPE: ${{ matrix.rust_scope }}
          CI_CLIPPY_SCOPE: ${{ matrix.clippy_scope }}
          CI_CARGO_TARGET_ARGS: ${{ matrix.cargo_target_args }}
          CI_CARGO_FEATURES: ${{ matrix.cargo_features }}
        run: |
          set -o pipefail
          mkdir -p reports/validation
          make --jobs="$WORKER_BUDGET" --keep-going "validate-ci-scoped-${{ matrix.target }}" 2>&1 | tee "reports/validation/rust-${{ matrix.lane }}.log"

      - name: Check directly changed Rust API documentation
        if: always() && github.event_name == 'pull_request' && matrix.target == 'clippy' && matrix.clippy_scope != '--workspace' && matrix.clippy_scope != '' && matrix.clippy_scope != '-p cd_papers'
        env:
          DOCS_RUST_SCOPE: ${{ matrix.clippy_scope }}
        run: |
          set -euo pipefail
          make --jobs="$WORKER_BUDGET" docs-rustdoc DOCS_PROFILE_FLAGS='--profile validation' DOCS_CARGO_TARGET_DIR="$CARGO_TARGET_DIR" DOCS_CARGO_BUILD_DIR="$GITHUB_WORKSPACE/.cache/gate-cbuild" 2>&1 | tee "reports/validation/rustdoc-${{ matrix.lane }}.log"

      - name: Record compiler cache diagnostics
        if: always() && steps.compiler-cache.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p reports/validation
          sccache --show-stats --stats-format=json > "reports/validation/sccache-${{ matrix.lane }}.json"
          write_errors="$(jq -er '.stats.cache_write_errors' "reports/validation/sccache-${{ matrix.lane }}.json")"
          error_log=/dev/null
          if [ -f "$SCCACHE_ERROR_LOG" ]; then
            error_log="$SCCACHE_ERROR_LOG"
          fi
          awk -v expected="$write_errors" '
            BEGIN {
              marker = "Error executing cache write: "
              kind_count = split("Unexpected Unsupported ConfigInvalid NotFound PermissionDenied IsADirectory NotADirectory AlreadyExists RateLimited IsSameFile ConditionNotMatch RangeNotSatisfied Unknown", kinds, " ")
              for (kind_index = 1; kind_index <= kind_count; kind_index++) known[kinds[kind_index]] = 1
            }
            index($0, marker) {
              message = substr($0, index($0, marker) + length(marker))
              split(message, fields, " ")
              kind = fields[1]
              if (!(kind in known) || fields[2] !~ /^\((permanent|temporary|persistent)\)$/ || fields[3] != "at") kind = "Unknown"
              counts[kind]++
              observed++
            }
            END {
              printf "expected_write_errors\t%d\nobserved_write_errors\t%d\n", expected, observed
              for (kind_index = 1; kind_index <= kind_count; kind_index++) printf "%s\t%d\n", kinds[kind_index], counts[kinds[kind_index]]
              if (observed != expected) exit 1
            }
          ' "$error_log" > "reports/validation/sccache-write-errors-${{ matrix.lane }}.tsv"

      - name: Retain one shared compiler entry archive
        if: success() && matrix.lane == fromJSON(needs.validation-core.outputs.rust_matrix).include[1].lane && steps.compiler-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.compiler-cache-restore.outputs.cache-primary-key }}

      - name: Upload Rust validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-validation-rust-${{ matrix.lane }}
          path: reports/validation/**
          if-no-files-found: warn
          retention-days: 14

  benchmark:
    needs: validation-policy
    if: always() && needs.validation-policy.outputs.benchmark == 'true'
    uses: ./.github/workflows/bench-cd-kernel.yml

  proofs:
    needs: validation-policy
    if: always() && needs.validation-policy.outputs.proofs == 'true'
    uses: ./.github/workflows/proofs.yml

  paper:
    needs: validation-policy
    if: always() && needs.validation-policy.outputs.paper == 'true'
    uses: ./.github/workflows/paper.yml

  unsafe-survey:
    needs: validation-policy
    if: always() && needs.validation-policy.outputs.unsafe_survey == 'true'
    uses: ./.github/workflows/unsafe-survey.yml
    with:
      run_workspace_survey: true

  certificates:
    needs: validation-core
    if: always() && needs.validation-core.outputs.certificates == 'true'
    uses: ./.github/workflows/navier-stokes-certificates.yml

  validation:
    needs: [validation-policy, validation-core, validation-governance, validation-casimir-audit, rust-validation, benchmark, proofs, paper, unsafe-survey, docs-book-check, certificates]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report aggregate validation admission
        env:
          POLICY_RESULT: ${{ needs.validation-policy.result }}
          CORE_RESULT: ${{ needs.validation-core.result }}
          GOVERNANCE_RESULT: ${{ needs.validation-governance.result }}
          CASIMIR_AUDIT_RESULT: ${{ needs.validation-casimir-audit.result }}
          DOCS_RESULT: ${{ needs.docs-book-check.result }}
          CERTIFICATES_RESULT: ${{ needs.certificates.result }}
          RUST_RESULT: ${{ needs.rust-validation.result }}
          BENCHMARK_SELECTED: ${{ needs.validation-policy.outputs.benchmark }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          PROOFS_SELECTED: ${{ needs.validation-policy.outputs.proofs }}
          PROOFS_RESULT: ${{ needs.proofs.result }}
          PAPER_SELECTED: ${{ needs.validation-policy.outputs.paper }}
          PAPER_RESULT: ${{ needs.paper.result }}
          UNSAFE_SURVEY_SELECTED: ${{ needs.validation-policy.outputs.unsafe_survey }}
          UNSAFE_SURVEY_RESULT: ${{ needs.unsafe-survey.result }}
          RUN_RUST: ${{ needs.validation-core.outputs.run_rust }}
          RUN_GOVERNANCE: ${{ needs.validation-core.outputs.run_rust == 'true' || needs.validation-core.outputs.run_governance == 'true' }}
          RUN_CASIMIR_AUDIT: ${{ needs.validation-core.outputs.casimir_audit }}
          RUN_DOCS: ${{ needs.validation-core.outputs.docs }}
          RUN_CERTIFICATES: ${{ needs.validation-core.outputs.certificates }}
        run: |
          set -euo pipefail
          failure_count=0
          for result_variable in POLICY_RESULT CORE_RESULT; do
            result="${!result_variable}"
            printf '%s=%s\n' "$result_variable" "$result"
            if [ "$result" != success ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          for lane in GOVERNANCE CASIMIR_AUDIT DOCS CERTIFICATES; do
            selected_variable="RUN_${lane}"
            result_variable="${lane}_RESULT"
            selected="${!selected_variable}"
            result="${!result_variable}"
            printf 'RUN_%s=%s\n%s_RESULT=%s\n' "$lane" "$selected" "$lane" "$result"
            if [ "$selected" = true ]; then
              if [ "$result" != success ]; then
                failure_count=$((failure_count + 1))
              fi
            elif [ "$result" != skipped ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          printf 'RUST_RESULT=%s\n' "$RUST_RESULT"
          if [ "$RUN_RUST" = true ]; then
            if [ "$RUST_RESULT" != success ]; then
              failure_count=$((failure_count + 1))
            fi
          elif [ "$RUST_RESULT" != skipped ]; then
            failure_count=$((failure_count + 1))
          fi
          for component in BENCHMARK PROOFS PAPER UNSAFE_SURVEY; do
            selected_variable="${component}_SELECTED"
            result_variable="${component}_RESULT"
            selected="${!selected_variable}"
            result="${!result_variable}"
            printf '%s_SELECTED=%s\n%s_RESULT=%s\n' "$component" "$selected" "$component" "$result"
            if [ "$selected" = true ]; then
              if [ "$result" != success ]; then
                failure_count=$((failure_count + 1))
              fi
            elif [ "$result" != skipped ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          if [ "$failure_count" -ne 0 ]; then
            echo "Collected $failure_count failing validation job group(s)." >&2
            exit 1
          fi

  docs-book-check:
    needs: [validation-core]
    if: always() && needs.validation-core.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.40,sccache@0.15.0
      - name: Install configured linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold
      - name: Resolve process-visible worker count
        run: |
          set -euo pipefail
          rustc --edition=2024 -D warnings crates/gororoba_cli/src/bin/detect_worker_budget.rs -o "$RUNNER_TEMP/detect-worker-budget"
          worker_budget="$("$RUNNER_TEMP/detect-worker-budget")"
          echo "Hosted book validation uses $worker_budget workers from std::thread::available_parallelism()."
          for variable in CI_WORKER_BUDGET WORKER_BUDGET CARGO_JOBS CARGO_BUILD_JOBS NEXTEST_TEST_THREADS RUST_TEST_THREADS RAYON_THREADS RAYON_NUM_THREADS; do
            echo "$variable=$worker_budget" >> "$GITHUB_ENV"
          done
      - name: Restore book renderer dependencies
        id: book-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ github.workspace }}/.cache/book-cbuild
            ${{ github.workspace }}/target/book-target
          key: docs-book-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.lock', 'crates/book_docs/**') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            docs-book-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.lock', 'crates/book_docs/**') }}-
      - name: Render and validate the book source
        run: make --keep-going docs-book DOCS_BOOK_CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/book-target" DOCS_BOOK_CARGO_BUILD_DIR="$GITHUB_WORKSPACE/.cache/book-cbuild"
      - name: Retain book renderer dependencies
        if: success() && github.ref == 'refs/heads/main' && steps.book-cache.outputs.cache-primary-key != '' && steps.book-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ github.workspace }}/.cache/book-cbuild
            ${{ github.workspace }}/target/book-target
          key: ${{ steps.book-cache.outputs.cache-primary-key }}

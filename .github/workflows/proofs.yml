name: proofs

# The Rocq proof tree lives in gororoba-math under rocq/open; its build, the
# admission scan, the Schur-geometry checkpoint, the plugin compatibility
# fixtures and the extraction golden diff run in gororoba-math through
# ci/check_rocq.sh. This workflow keeps the checks that read gororoba-open code,
# the control-plane receipts and the retained evidence, against the
# gororoba-math commit that ci/gororoba_math.pin names.

# A pull request that changes the pin, the registry or the provenance store
# runs the workflow, so the proof-source checks that the governance gate skips
# without a checkout run in full before merge.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ci/gororoba_math.pin
      - registry/**
      - Cargo.lock
      - crates/provenance_store/**
      - crates/repo_root/**
      - crates/gororoba_db/**
      - crates/gororoba_cli_data/src/bin/claims_verify.rs
      - crates/gororoba_cli_physics/src/bin/vacuum_response_audit.rs
      - crates/gororoba_cli_physics/src/bin/vacuum_response_audit/**
      - plans/vacuum_energy_falsification.toml
      - plans/vacuum_integration_contract.toml
      - .github/workflows/proofs.yml
      - .github/actions/fetch-gororoba-math/action.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      # .cargo/config.toml names sccache as the rustc wrapper, so every cargo
      # command of this workflow needs it on PATH.
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.15.0

      - name: Resolve process-visible worker count
        run: |
          set -euo pipefail
          rustc --edition=2024 -D warnings crates/gororoba_cli/src/bin/detect_worker_budget.rs -o "$RUNNER_TEMP/detect-worker-budget"
          worker_budget="$("$RUNNER_TEMP/detect-worker-budget")"
          {
            echo "OPAMJOBS=$worker_budget"
            echo "CARGO_BUILD_JOBS=$worker_budget"
            echo "RAYON_NUM_THREADS=$worker_budget"
            echo "RUST_TEST_THREADS=$worker_budget"
          } >> "$GITHUB_ENV"
          echo "Hosted proof validation uses $worker_budget workers from std::thread::available_parallelism()."

      - name: Fetch the pinned gororoba-math checkout
        uses: ./.github/actions/fetch-gororoba-math
        with:
          paths: ci rocq/open

      - name: Install opam 2.6.1 and Rust linker
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang mold glslc libcfitsio-dev libhdf5-dev libfontconfig1-dev libopenblas-dev libblas-dev liblapack-dev pkg-config
          curl --fail --location --retry 3 \
            https://github.com/ocaml/opam/releases/download/2.6.1/opam-2.6.1-x86_64-linux \
            --output "$RUNNER_TEMP/opam"
          echo "b533d393a6967150d6ef41cb3d71e147e93ecbabeb59e921aa412c0ae79ebe3d  $RUNNER_TEMP/opam" | sha256sum --check
          chmod +x "$RUNNER_TEMP/opam"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The key follows the ports and the installer of the pinned checkout, so a
      # pin that leaves them unchanged reuses the switch.
      - name: Restore opam
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: opam2.6.1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-ocaml5.5.1-rocq9.3.0-plugins-${{ hashFiles('.cache/gororoba-math/rocq/open/opam/**', '.cache/gororoba-math/ci/install_rocq.sh') }}-v2

      - name: Install Rocq 9.3 from the pinned gororoba-math checkout
        run: sh "$GOROROBA_MATH/ci/install_rocq.sh"

      - name: Save installed proof toolchain
        id: opam-cache-save
        if: steps.opam-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Verify genuine theorem receipt replay
        id: receipt-replay
        continue-on-error: true
        run: |
          eval "$(opam env --switch=rocq-9.3)"
          cargo test --locked -p provenance_store --lib \
            theorem_execution::tests::genuine_rocq_replay \
            -- --ignored

      - name: Verify theorem observable bindings
        id: observable-bindings
        continue-on-error: true
        run: |
          failure=0
          cargo test --locked -p provenance_store --lib quantum_bindings -- --include-ignored || failure=1
          cargo run --locked -p provenance_store --example verify_quantum_bindings -- \
            "$GOROROBA_MATH/rocq/open/evidence/quantum_observables/bindings.json" || failure=1
          exit "$failure"

      - name: Verify control-plane proof paths and kernel receipts
        id: control-plane
        continue-on-error: true
        run: |
          set -euo pipefail
          # Without the tree every proof-source check is skipped and counted, so
          # that run reports how many checks the registry lists; the run with the
          # tree must verify exactly that many and skip none.
          env -u GOROROBA_MATH cargo run --locked -p gororoba_db --bin gororoba-db -- theorem identity validate | tee "$RUNNER_TEMP/theorem-identity-listed.log"
          cargo run --locked -p gororoba_db --bin gororoba-db -- theorem identity validate | tee "$RUNNER_TEMP/theorem-identity.log"
          listed="$(sed -n 's/.*proof-source checks: 0 verified, \([0-9][0-9]*\) skipped.*/\1/p' "$RUNNER_TEMP/theorem-identity-listed.log")"
          verified="$(sed -n 's/.*proof-source checks: \([0-9][0-9]*\) verified, 0 skipped.*/\1/p' "$RUNNER_TEMP/theorem-identity.log")"
          echo "proof-source checks listed by the registry: ${listed:-missing}; verified against the pinned tree: ${verified:-missing}"
          if [ -z "$listed" ] || [ -z "$verified" ] || [ "$verified" -eq 0 ] || [ "$verified" -ne "$listed" ]; then
            echo "proof-source checks are missing, zero, skipped or fewer than the registry lists" >&2
            exit 1
          fi
          # claims-verify reads every recorded proofs/ path of the claim and
          # theorem rows from the pinned tree; a SKIP line means it read none.
          cargo run --locked -p gororoba_cli_data --bin claims-verify -- --check evidence 2>&1 | tee "$RUNNER_TEMP/claims-evidence.log"
          if grep -q '^SKIP:' "$RUNNER_TEMP/claims-evidence.log"; then
            echo "claims-verify skipped its proof-source checks although the tree is fetched" >&2
            exit 1
          fi

      - name: Verify vacuum-response formal references
        id: formal-references
        continue-on-error: true
        run: |
          cargo test --locked -p gororoba_cli_physics --bin vacuum-response-audit \
            frontier_contract -- --include-ignored

      - name: Report collected proof failures
        if: always()
        env:
          CACHE_SAVE_OUTCOME: ${{ steps.opam-cache-save.outcome }}
          RECEIPT_REPLAY_OUTCOME: ${{ steps.receipt-replay.outcome }}
          OBSERVABLE_BINDINGS_OUTCOME: ${{ steps.observable-bindings.outcome }}
          CONTROL_PLANE_OUTCOME: ${{ steps.control-plane.outcome }}
          FORMAL_REFERENCES_OUTCOME: ${{ steps.formal-references.outcome }}
        run: |
          set -euo pipefail
          failure_count=0
          # A verification lane that did not succeed (failed, was skipped because
          # an earlier step stopped the job, or was cancelled) is a failure. The
          # cache save is skipped on a cache hit, so it fails only on failure.
          for outcome_variable in RECEIPT_REPLAY_OUTCOME OBSERVABLE_BINDINGS_OUTCOME CONTROL_PLANE_OUTCOME FORMAL_REFERENCES_OUTCOME; do
            outcome="${!outcome_variable}"
            printf '%s=%s\n' "$outcome_variable" "$outcome"
            if [ "$outcome" != success ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          printf 'CACHE_SAVE_OUTCOME=%s\n' "$CACHE_SAVE_OUTCOME"
          if [ "$CACHE_SAVE_OUTCOME" = failure ] || [ "$CACHE_SAVE_OUTCOME" = cancelled ]; then
            failure_count=$((failure_count + 1))
          fi
          if [ "$failure_count" -ne 0 ]; then
            echo "Collected $failure_count failing proof lane(s)." >&2
            exit 1
          fi

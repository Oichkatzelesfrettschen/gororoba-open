name: proofs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.15.0

      - name: Resolve process-visible worker count
        run: |
          set -euo pipefail
          rustc --edition=2024 -D warnings crates/gororoba_cli/src/bin/detect_worker_budget.rs -o "$RUNNER_TEMP/detect-worker-budget"
          worker_budget="$("$RUNNER_TEMP/detect-worker-budget")"
          {
            echo "MAKE_JOBS=$worker_budget"
            echo "OPAMJOBS=$worker_budget"
            echo "CARGO_BUILD_JOBS=$worker_budget"
            echo "RAYON_NUM_THREADS=$worker_budget"
            echo "RUST_TEST_THREADS=$worker_budget"
          } >> "$GITHUB_ENV"
          echo "Hosted proof validation uses $worker_budget workers from std::thread::available_parallelism()."

      - name: Install opam and Rust linker
        run: |
          sudo apt-get update
          sudo apt-get install -y opam clang mold

      - name: Restore opam
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-ubuntu24-ocaml5.5.0-rocq9.2.0-stdlib9.2.0-flocq4.2.2-v1

      - name: Install Rocq 9.1
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam init --bare --disable-sandboxing --yes
          opam switch create rocq-9.2 ocaml-base-compiler.5.5.0 --jobs="$OPAMJOBS" --yes
          opam repository add rocq-released https://rocq-prover.org/opam/released --switch=rocq-9.2 --yes
          eval "$(opam env --switch=rocq-9.2)"
          opam install rocq-core.9.2.0 rocq-stdlib.9.2.0 coq-flocq.4.2.2 --jobs="$OPAMJOBS" --yes

      - name: Save installed proof toolchain
        id: opam-cache-save
        if: steps.opam-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Compile all proofs
        id: compile
        continue-on-error: true
        working-directory: proofs
        run: |
          eval "$(opam env --switch=rocq-9.2)"
          make --jobs="$MAKE_JOBS" --keep-going all

      - name: Zero-Admitted check
        id: admitted
        continue-on-error: true
        working-directory: proofs
        run: |
          eval "$(opam env --switch=rocq-9.2)"
          make --jobs="$MAKE_JOBS" --keep-going check-admissions

      - name: Extraction golden-file diff
        id: extraction
        continue-on-error: true
        working-directory: proofs
        run: |
          eval "$(opam env --switch=rocq-9.2)"
          make --jobs="$MAKE_JOBS" --keep-going extract-check

      - name: Verify genuine theorem receipt replay
        id: receipt-replay
        continue-on-error: true
        run: |
          eval "$(opam env --switch=rocq-9.2)"
          cargo test --locked -p provenance_store --lib \
            theorem_execution::tests::genuine_rocq_replay \
            -- --ignored

      - name: Report collected proof failures
        if: always()
        env:
          CACHE_SAVE_OUTCOME: ${{ steps.opam-cache-save.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          ADMITTED_OUTCOME: ${{ steps.admitted.outcome }}
          EXTRACTION_OUTCOME: ${{ steps.extraction.outcome }}
          RECEIPT_REPLAY_OUTCOME: ${{ steps.receipt-replay.outcome }}
        run: |
          set -euo pipefail
          failure_count=0
          for outcome_variable in CACHE_SAVE_OUTCOME COMPILE_OUTCOME ADMITTED_OUTCOME EXTRACTION_OUTCOME RECEIPT_REPLAY_OUTCOME; do
            outcome="${!outcome_variable}"
            printf '%s=%s\n' "$outcome_variable" "$outcome"
            if [ "$outcome" = failure ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          if [ "$failure_count" -ne 0 ]; then
            echo "Collected $failure_count failing proof lane(s)." >&2
            exit 1
          fi

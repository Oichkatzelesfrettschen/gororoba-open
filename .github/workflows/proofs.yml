name: proofs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: sccache@0.15.0

      - name: Resolve process-visible worker count
        run: |
          set -euo pipefail
          rustc --edition=2024 -D warnings crates/gororoba_cli/src/bin/detect_worker_budget.rs -o "$RUNNER_TEMP/detect-worker-budget"
          worker_budget="$("$RUNNER_TEMP/detect-worker-budget")"
          {
            echo "MAKE_JOBS=$worker_budget"
            echo "OPAMJOBS=$worker_budget"
            echo "CARGO_BUILD_JOBS=$worker_budget"
            echo "RAYON_NUM_THREADS=$worker_budget"
            echo "RUST_TEST_THREADS=$worker_budget"
          } >> "$GITHUB_ENV"
          echo "Hosted proof validation uses $worker_budget workers from std::thread::available_parallelism()."

      - name: Install opam 2.6.1 and Rust linker
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang mold
          curl --fail --location --retry 3 \
            https://github.com/ocaml/opam/releases/download/2.6.1/opam-2.6.1-x86_64-linux \
            --output "$RUNNER_TEMP/opam"
          echo "b533d393a6967150d6ef41cb3d71e147e93ecbabeb59e921aa412c0ae79ebe3d  $RUNNER_TEMP/opam" | sha256sum --check
          chmod +x "$RUNNER_TEMP/opam"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Restore opam
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: opam2.6.1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-ocaml5.5.1-rocq9.3.0-plugins-${{ hashFiles('proofs/opam/**') }}-v1

      - name: Install Rocq 9.3
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam init --bare --disable-sandboxing --yes
          opam switch create rocq-9.3 ocaml-base-compiler.5.5.1 --jobs="$OPAMJOBS" --yes
          opam repository add rocq-released https://rocq-prover.org/opam/released --switch=rocq-9.3 --yes
          eval "$(opam env --switch=rocq-9.3)"
          opam install rocq-core.9.3.0 rocq-stdlib.9.2.0 coq-flocq.4.2.2 dune.3.23.1 --jobs="$OPAMJOBS" --yes

      - name: Install and test compatible proof plugins
        id: plugins
        continue-on-error: true
        run: |
          set -euo pipefail
          # A restored ~/.opam keeps the checkout path of the run that saved it,
          # and opam refuses to re-add a repository name under a new URL.
          if opam repository list --all --short | grep -qx gororoba-proof-ports; then
            opam repository set-url gororoba-proof-ports "file://$GITHUB_WORKSPACE/proofs/opam"
          else
            opam repository add gororoba-proof-ports "$GITHUB_WORKSPACE/proofs/opam" --switch=rocq-9.3 --yes
          fi
          opam install --switch=rocq-9.3 rocq-elpi.3.5.1 rocq-hierarchy-builder.1.10.3 rocq-mathcomp-ssreflect.2.6.0 rocq-mathcomp-algebra.2.6.0 rocq-mathcomp-field.2.6.0 rocq-mathcomp-finite-group.2.6.0 rocq-mathcomp-solvable.2.6.0 rocq-micromega-plugin.1.1.1 coq-ext-lib.0.13.2 --jobs="$OPAMJOBS" --yes
          opam install --switch=rocq-9.3 rocq-equations.1.3.2+9.3 --with-test --jobs="$OPAMJOBS" --yes
          opam switch import --switch=rocq-9.3 --jobs="$OPAMJOBS" --yes proofs/opam/qualified-rocq-9.3.export
          opam exec --switch=rocq-9.3 -- make -C proofs --jobs="$MAKE_JOBS" --keep-going check-plugins

      - name: Save installed proof toolchain
        id: opam-cache-save
        if: steps.opam-cache.outputs.cache-hit != 'true' && steps.plugins.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Compile all proofs
        id: compile
        continue-on-error: true
        working-directory: proofs
        run: |
          eval "$(opam env --switch=rocq-9.3)"
          make --jobs="$MAKE_JOBS" --keep-going all

      - name: Check Schur geometry source checkpoint
        id: schur-geometry
        continue-on-error: true
        working-directory: proofs
        run: |
          eval "$(opam env --switch=rocq-9.3)"
          make --jobs="$MAKE_JOBS" --keep-going check-schur-geometry

      - name: Zero-Admitted check
        id: admitted
        continue-on-error: true
        working-directory: proofs
        run: |
          eval "$(opam env --switch=rocq-9.3)"
          make --jobs="$MAKE_JOBS" --keep-going check-admissions

      - name: Extraction golden-file diff
        id: extraction
        continue-on-error: true
        working-directory: proofs
        run: |
          eval "$(opam env --switch=rocq-9.3)"
          make --jobs="$MAKE_JOBS" --keep-going extract-check

      - name: Verify genuine theorem receipt replay
        id: receipt-replay
        continue-on-error: true
        run: |
          eval "$(opam env --switch=rocq-9.3)"
          cargo test --locked -p provenance_store --lib \
            theorem_execution::tests::genuine_rocq_replay \
            -- --ignored

      - name: Verify theorem observable bindings
        id: observable-bindings
        continue-on-error: true
        run: |
          failure=0
          cargo test --locked -p provenance_store --lib quantum_bindings || failure=1
          cargo run --locked -p provenance_store --example verify_quantum_bindings -- \
            proofs/evidence/quantum_observables/bindings.json "$GITHUB_WORKSPACE" || failure=1
          exit "$failure"

      - name: Report collected proof failures
        if: always()
        env:
          CACHE_SAVE_OUTCOME: ${{ steps.opam-cache-save.outcome }}
          PLUGINS_OUTCOME: ${{ steps.plugins.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          SCHUR_GEOMETRY_OUTCOME: ${{ steps.schur-geometry.outcome }}
          ADMITTED_OUTCOME: ${{ steps.admitted.outcome }}
          EXTRACTION_OUTCOME: ${{ steps.extraction.outcome }}
          RECEIPT_REPLAY_OUTCOME: ${{ steps.receipt-replay.outcome }}
          OBSERVABLE_BINDINGS_OUTCOME: ${{ steps.observable-bindings.outcome }}
        run: |
          set -euo pipefail
          failure_count=0
          for outcome_variable in CACHE_SAVE_OUTCOME PLUGINS_OUTCOME COMPILE_OUTCOME SCHUR_GEOMETRY_OUTCOME ADMITTED_OUTCOME EXTRACTION_OUTCOME RECEIPT_REPLAY_OUTCOME OBSERVABLE_BINDINGS_OUTCOME; do
            outcome="${!outcome_variable}"
            printf '%s=%s\n' "$outcome_variable" "$outcome"
            if [ "$outcome" = failure ]; then
              failure_count=$((failure_count + 1))
            fi
          done
          if [ "$failure_count" -ne 0 ]; then
            echo "Collected $failure_count failing proof lane(s)." >&2
            exit 1
          fi

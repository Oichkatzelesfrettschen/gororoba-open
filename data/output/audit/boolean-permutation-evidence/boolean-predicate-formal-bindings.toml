[[binding]]
proposal_key = "boolean-predicate-signed-xor-label-obstruction"
stable_id = "THM-LEGACY-BooleanPermutation"
legacy_name = "BooleanPermutation"
proof_path = "proofs/theories/BooleanPermutation.v"
title = "Boolean target flips and signed-XOR label obstruction"
statement = "An involutive toggle with a toggle-invariant Boolean predicate induces an involutive bijection; a cube mask disjoint from the target bit supplies that invariance. Reversing a word of involutions computes its inverse. Signed-XOR actions compose with the second phase evaluated on the translated label. A signed-XOR word fixing label zero has identity label motion while diagonal signs can remain nonconstant. The identity-padded five-bit N=21 multipliers 2, 4, and 16 fix zero, move one, violate the stated affine identity, and differ from every signed-XOR word on at least one of the 32 labels."
initial_status = "Verified"
where_stated = ["proofs/theories/BooleanPermutation.v"]
assumptions = "The abstract target-flip theorems quantify over an involutive toggle and a predicate invariant under that toggle. Cube theorems require Nat.land mask (2 ^ target) = 0. Inverse-word theorems require every gate to be involutive. Signed actions retain both Boolean phase and natural-number label. N=21 statements restrict comparison to labels below 32, multiply valid residues below 21, and fix labels 21 through 31. The declarations introduce these premises as quantified hypotheses."
kernel_result = "The source owns the stated formal scope. Append-only source-bound execution receipts determine kernel_checked admission independently of explanatory metadata."
replay_command = "cd proofs && rocq compile -q -w +default -R theories OpenGororoba -R verified OpenGororobaVerified theories/BooleanPermutation.v && rocq check -silent -o -R theories OpenGororoba -R verified OpenGororobaVerified OpenGororoba.BooleanPermutation"
falsifier = "A toggle-invariant predicate over an involutive toggle whose target flip fails involution, a target-disjoint mask whose cube fails bijectivity, or a signed-XOR word matching a named identity-padded N=21 multiplier on all 32 labels would falsify the corresponding formal proposition."

assumptions = "The carrier is Stdlib canonical rational Qc, equality is literal equality, and multiplication is the explicitly defined scalar Cayley-Dickson pair law. The obstruction quantifies over all scalar binary operations and all Qc pairs. Reconstruction retains both average and detail coordinates. Higher Cayley-Dickson multiplication, statistical compression, and physical implementations require separate premises."

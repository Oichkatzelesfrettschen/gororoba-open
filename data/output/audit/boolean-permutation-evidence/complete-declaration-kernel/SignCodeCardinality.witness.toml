[[declarations]]
name = "table_lookup_tabulate"
statement = "Lemma table_lookup_tabulate : forall order function input, table_lookup order (tabulate order function) input = function input"
assumptions = []

[[declarations]]
name = "table_extensional"
statement = "Lemma table_extensional : forall order (first second : boolean_table order), (forall input, table_lookup order first input = table_lookup order second input) -> first = second"
assumptions = []

[[declarations]]
name = "supported_tables_spec"
statement = "Lemma supported_tables_spec : forall order allowed table, In table (supported_tables order allowed) <-> forall mask, allowed mask = false -> table_lookup order table mask = false"
assumptions = []

[[declarations]]
name = "nodup_injective_map"
statement = "Lemma nodup_injective_map : forall (Input Output : Type) (function : Input -> Output) values, (forall first second, function first = function second -> first = second) -> NoDup values -> NoDup (map function values)"
assumptions = []

[[declarations]]
name = "nodup_cartesian_product"
statement = "Lemma nodup_cartesian_product : forall (Left Right : Type) (left : list Left) (right : list Right), NoDup left -> NoDup right -> NoDup (list_prod left right)"
assumptions = []

[[declarations]]
name = "supported_tables_unique"
statement = "Lemma supported_tables_unique : forall order allowed, NoDup (supported_tables order allowed)"
assumptions = []

[[declarations]]
name = "supported_tables_length"
statement = "Lemma supported_tables_length : forall order allowed, length (supported_tables order allowed) = 2 ^ (cube_count order allowed)"
assumptions = []

[[declarations]]
name = "anf_table"
statement = "Definition anf_table (order : nat) (coefficients : boolean_table order) : boolean_table order := tabulate order (anf_evaluate order (table_lookup order coefficients))"
assumptions = []

[[declarations]]
name = "anf_table_injective"
statement = "Lemma anf_table_injective : forall order first second, anf_table order first = anf_table order second -> first = second"
assumptions = []

[[declarations]]
name = "normalized_code_tables"
statement = "Definition normalized_code_tables (order : nat) : list (boolean_table (S (S (S order)))) := map (anf_table (S (S (S order)))) (supported_tables (S (S (S order))) (normalized_basis_mask (S (S order))))"
assumptions = []

[[declarations]]
name = "normalized_code_tables_spec"
statement = "Theorem normalized_code_tables_spec : forall order table, In table (normalized_code_tables order) <-> normalized_sign_span (S (S (S order))) (table_lookup (S (S (S order))) table)"
assumptions = []

[[declarations]]
name = "normalized_code_tables_unique"
statement = "Theorem normalized_code_tables_unique : forall order, NoDup (normalized_code_tables order)"
assumptions = []

[[declarations]]
name = "normalized_code_cardinality"
statement = "Theorem normalized_code_cardinality : forall order, length (normalized_code_tables order) = 2 ^ (2 ^ (S (S order)) - 1)"
assumptions = []

[[witness.declarations]]
name = "linear_substitution_preserves_degree"
statement = "Theorem linear_substitution_preserves_degree : forall polynomial substitution, (forall variable, polynomial_degree (substitution variable) <= 1) -> polynomial_degree (polynomial_substitute polynomial substitution) <= polynomial_degree polynomial"
assumptions = []

[[witness.declarations]]
name = "substitution_evaluation"
statement = "Theorem substitution_evaluation : forall polynomial substitution point, polynomial_evaluate (polynomial_substitute polynomial substitution) point = polynomial_evaluate polynomial (fun variable => polynomial_evaluate (substitution variable) point)"
assumptions = []

[[witness.declarations]]
name = "addition_preserves_filtration"
statement = "Theorem addition_preserves_filtration : forall left right bound, degree_at_most left bound -> degree_at_most right bound -> degree_at_most (fun point => xorb (left point) (right point)) bound"
assumptions = []

[[witness.declarations]]
name = "linear_pullback_preserves_filtration"
statement = "Theorem linear_pullback_preserves_filtration : forall function bound substitution, degree_at_most function bound -> (forall variable, polynomial_degree (substitution variable) <= 1) -> degree_at_most (fun point => function (fun variable => polynomial_evaluate (substitution variable) point)) bound"
assumptions = []

[[witness.declarations]]
name = "cochain_differential_preserves_degree"
statement = "Theorem cochain_differential_preserves_degree : forall polynomial faces, Forall (fun face => forall variable, polynomial_degree (face variable) <= 1) faces -> polynomial_degree (face_sum polynomial faces) <= polynomial_degree polynomial"
assumptions = []


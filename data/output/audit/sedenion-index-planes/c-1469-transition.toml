[[successor]]
proposal_key = "sedenion-index-lines-and-octets-incidence"
statement = "In the basis index group {0..15} of the 16D (sedenions) under xor there are 35 lines {a, b, a xor b} of nonzero indices and 15 xor-closed octets containing 0 (C582_IndexPlaneIncidence.plane_line_incidence, closed_octets_are_planes). Each line lies in exactly 3 octets, and two distinct octets share 4 indices and exactly one line. The real span of each octet is closed under the sedenion product (C029_SedenionOctonionSubalgebras.C029_family_closed), and the three units of a line associate in all six orders (sorted_triple_classes). The octonion index set {0..7} holds 7 lines (late_planes_are_fano_lines). These are the values H_4 = 35, T_4 = 15, 7 T_4 / H_4 = 3 and H_3 = 7 of the formulas that C-1469 attributes to Wilmot (arXiv:2512.07210); this statement asserts the formulas at no other n."
initial_status = "Provisional"
source_or_implementation_boundary = "Formal statement about index sets and basis units of level 4 of the integer Cayley-Dickson tower of gororoba-math rocq/open (C582_IndexPlaneIncidence.v), decided by evaluation, with the closure of the 15 real spans from C029_SedenionOctonionSubalgebras.v, at the commit and digests of data/output/audit/sedenion-index-planes/source-map.toml. Seven of the 15 spans are not isomorphic to the octonions (C-1787)."
required_falsifier = "A build, axiom-audit or kernel-check failure of the cited sources at the recorded commit withholds formal support for this successor. An exact enumeration that finds a line count other than 35, a count of xor-closed octets containing 0 other than 15, a pair of distinct octets sharing a number of lines other than 1 or a number of indices other than 4, a line lying in a number of octets other than 3, or a line count of {0..7} other than 7 falsifies the corresponding clause."

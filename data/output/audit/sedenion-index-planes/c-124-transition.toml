[[successor]]
proposal_key = "middle-moufang-identity-holds-through-octonions"
statement = "The middle Moufang identity (ab)(ca) = a((bc)a) holds at every Cayley-Dickson level k <= 3, that is through dim=8 (octonions), over every commutative ring whose star is the identity (CayleyDickson.Tower.moufang_middle_of_le_three). At every level k >= 4, from the 16D (sedenions) on, it fails over every not necessarily associative ring with a star in which 2 is nonzero (CayleyDickson.Tower.exists_moufang_middle_ne). The flexible law (ab)a = a(ba) is a different identity; it holds at every level over every commutative ring whose star is the identity (CayleyDickson.Tower.mul_mul_self_eq'), and C-100 and C-101 record tested real instances through dimensions 256 and 2048. The growth of the violation with dimension reported by C-124 is a measurement and is not part of this statement."
initial_status = "Provisional"
source_or_implementation_boundary = "Formal statements in the Lean library of gororoba-math (lean/GororobaMath/CayleyDickson/Alternative.lean and FlexibleLaw.lean) at the commit and digests of data/output/audit/sedenion-index-planes/source-map.toml. The holding half of the middle Moufang result and the flexible law assume a commutative ring with identity star; the failure half assumes a not necessarily associative ring with a star and 2 <> 0."
required_falsifier = "A build, axiom-audit or kernel-check failure of the cited sources at the recorded commit withholds formal support for this successor. A triple of elements of a level k <= 3 over a commutative ring with identity star that violates the middle Moufang identity, a proof of that identity at level 4 over the integers, or a pair violating the flexible law over such a ring falsifies the corresponding clause."
where_stated = ["data/output/audit/sedenion-index-planes/source-map.toml"]

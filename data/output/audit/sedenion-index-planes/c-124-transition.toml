rationale = "The identity (ab)(ca) = a((bc)a) is the middle Moufang identity. The flexible law (ab)a = a(ba) holds at every Cayley-Dickson level over a commutative ring whose star is the identity (CayleyDickson.Tower.mul_mul_self_eq' in gororoba-math; C-100 and C-101 record the tested real instances), so the sentence 'the flexibility identity ... is lost at dim=16' is false of the identity it names. The measured loss is real for the identity as written: Tower.moufang_middle_of_le_three proves it at levels up to 3 (dim <= 8) over a commutative ring whose star is the identity, and Tower.exists_moufang_middle_ne refutes it at every level from 4 over a ring with 2 <> 0. The computation of the cited script is a valid test of the written identity; the claim attaches it to the wrong identity name, so the named sentence is falsified, C-124 becomes Superseded and the successor states the identity under its name with the proofs."

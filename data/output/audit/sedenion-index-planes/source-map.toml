[[formal_edge]]
claim = "C-581"
claim_sentence = "All 15 hyperplanes of Z_2^4 (sedenion index group) are alternative algebras (octonion subalgebras)."
implementation_file = "crates/algebra_analysis/src/subalgebra.rs"
implementation_scope = "is_alternative_subalgebra checks xor closure of the index set, the associator of each basis triple (e_a, e_b, e_(a xor b)), and a count of seven oriented Fano triples; test_all_15_are_alternative asserts its result on the 15 index sets. No check evaluates an alternative law on a sum of basis units."
contradicted_by = "C029_SedenionOctonionSubalgebras.C029_octonion_subalgebra_iff and not_left_alt_9 to not_left_alt_15: the spans with 9 <= u <= 15 each hold a pair x = e_a + e_b, y = e_c with (x x) y <> x (x y)."

[[formal_edge]]
claim = "C-581"
role = "successor"
formal_file = "rocq/open/verified/C582_IndexPlaneIncidence.v"
theorems = ["closed_octets_are_planes", "plane_line_incidence", "basis_units_alternate"]
formal_scope = "Boolean decisions by evaluation at level 4 of the integer tower: the 15 xor-closed octets among the 6435 eight-element index sets containing 0 are the sets of even parity of (u land i) for u in 1..15; each holds 7 of the 35 lines, each line lies in 3, two distinct ones share 4 indices and one line; both alternative laws hold on every pair of basis units."
not_stated = ["Alternativity of any real span; C-1787 carries the 8 to 7 split.", "Any statement at another level."]

[[formal_edge]]
claim = "C-124"
claim_sentence = "The flexibility identity (ab)(ca) = a((bc)a) holds exactly through dim=8 (octonions) and is lost at dim=16 (sedenions), with violations growing toward ~1.7."
contradicted_by = "The written identity is the middle Moufang identity. The flexible law (ab)a = a(ba) is CayleyDickson.Tower.mul_mul_self_eq' of FlexibleLaw.lean, proved at every level over a commutative ring whose star is the identity."

[[formal_edge]]
claim = "C-124"
role = "successor"
formal_file = "lean/GororobaMath/CayleyDickson/Alternative.lean"
depends_on = "lean/GororobaMath/CayleyDickson/FlexibleLaw.lean"
theorems = ["CayleyDickson.Tower.moufang_middle_of_le_three : levels k <= 3, CommRing with StarRing and TrivialStar", "CayleyDickson.Tower.exists_moufang_middle_ne : levels k >= 4, NonAssocRing (not necessarily associative) with StarRing and 2 <> 0", "CayleyDickson.Tower.mul_mul_self_eq' : every level, CommRing with StarRing and TrivialStar"]
formal_scope = "The middle Moufang identity at levels up to 3 and its failure from level 4; the flexible law at every level."
not_stated = ["Any magnitude or growth of the violation.", "The holding half over a noncommutative ring or a ring with a nontrivial star."]

[[formal_edge]]
claim = "C-1469"
claim_sentence = "Each pair shares 2^(n-2)-1 quaternions (3 for sedenions)."
recorded_formal_file = "rocq/open/verified/C1469_TowerTrilinearity.v"
recorded_formal_scope = "Identity, square and anticommutation properties of the sign function at dimensions 16, 32 and 64. The file states no H_n or T_n count."
contradicted_by = "C582_IndexPlaneIncidence.plane_line_incidence: two distinct xor-closed octets share exactly one line; each line lies in exactly 3 octets, which is the quotient 7 T_4 / H_4 the cited test computes."

[[formal_edge]]
claim = "C-1469"
role = "successor"
formal_file = "rocq/open/verified/C582_IndexPlaneIncidence.v"
depends_on = "rocq/open/verified/C029_SedenionOctonionSubalgebras.v"
theorems = ["plane_line_incidence", "closed_octets_are_planes", "sorted_triple_classes", "late_planes_are_fano_lines", "C029_SedenionOctonionSubalgebras.C029_family_closed"]
formal_scope = "35 lines and 15 xor-closed octets at level 4 with their incidence counts; closure of the 15 real spans under the sedenion product; associativity of the three units of a line in all six orders; 7 lines in the index set {0..7}."
not_stated = ["The formulas H_n and T_n at any n other than the values H_3, H_4 and T_4.", "H_5 = 155.", "That the real span of a line is isomorphic to the quaternions."]


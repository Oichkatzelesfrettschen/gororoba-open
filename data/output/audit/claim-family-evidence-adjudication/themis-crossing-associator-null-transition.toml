[[successor]]
proposal_key = "themis-crossing-ratio-boundary-fluctuation-layer"
statement = "At 9455 THEMIS-A magnetopause crossings of the Staples et al. (2020) version 2 catalog (3-second FGM rows, 32D unit-normalized delay windows of 8 rows by 4 channels), the late-to-early ratio of the sliding Cayley-Dickson associator norm over the 12 norms that end one row before the catalogued crossing has median 1.44 with 64.0 percent of crossings above 1; at random times of the same day files the median is 1.00 with 50.3 percent above 1. The same ratio of the windowed increment energy, a sum of squared field increments with no product, has median 1.54 normalized by the squared field and 1.39 raw. With the window moved back 12, 24 and 96 rows the associator median is 1.08, 1.04 and 1.00, and mirrored over the rows after the crossing it is 1.65 with 69.4 percent above 1. The median raw increment energy is 6.4 nT squared 100 rows before the crossing, 22.1 at 5 rows before, 50.7 at the crossing, 31.0 at 5 rows after and 7.9 at 100 rows after, against 0.17 to 0.18 at random times. The ratio therefore measures the flank of a peak of magnetic fluctuation 10 rows (30 seconds) wide at half maximum centered on the catalogued crossing, present on both sides of it, inside an interval about 35 times more disturbed than random times of the same days."
initial_status = "Provisional"
source_or_implementation_boundary = "Computational statement about one probe, one catalog and one embedding, produced by B-themis-cd-crossing-null. It attributes nothing to the Cayley-Dickson product: a sum of squared increments gives the same ratios. It asserts no lead time and no forecast skill, since the mirrored ratio after the crossing is also above 1 and the catalog's timing resolution is comparable to the width of the peak. It asserts nothing about the per-sample benchmark claims on the same catalog."
required_falsifier = "A rerun of B-themis-cd-crossing-null on the same files and seed whose crossing ratios or raw-energy profile leave the retained output by more than rounding; a statistic of the rows before the crossing whose ratio exceeds its mirrored value after the crossing beyond a file-bootstrap interval in every crossing direction; or an associator ratio that exceeds the increment-energy ratio beyond that interval."

exercised_falsifier = "B-themis-cd-crossing-null on the probe-A crossings of the Staples et al. (2020) version 2 catalog and the retained THEMIS-A FGM day files, seed 20261115. The reading of C-1619, that the ratio above 1 confirms a precursor buildup which the Cayley-Dickson associator detects, stays standing if the ratio exceeds that of a product-free statistic on the same rows and if the mirrored ratio after the crossing is near 1. It is falsified when a sum of squared increments reproduces the ratio at every window offset and when the mirrored ratio after the crossing is also well above 1. The comparison with random times of the same files tests whether the ratio is an artifact of the statistic."
proposed_claim_status = "Superseded"
rationale = "C-1619 states a measurement and a reading of it. The measurement replicates exactly: 9455 crossings analyzed and 35 skipped, late-to-early ratio median 1.4434, mean 4.4796, quartiles 0.748 and 3.117, 64.0 percent above 1. The survey's window ends one row before the catalogued crossing, so no window holds the catalogued row; the catalog times a crossing from 24-second samples with criteria met inside 60 seconds, so the event itself may lie inside the 36-second window. The ratio is not an artifact of the statistic: at random times of the same files, one per crossing and more than 400 rows from any crossing, the median is 1.00 and 50.3 percent lie above 1, and with the window moved back 12, 24, 48 and 96 rows the crossing median falls to 1.08, 1.04, 1.01 and 1.00. The reading fails twice. A product-free statistic gives the same result: the late-to-early ratio of the windowed increment energy, the sum over 9 increments of the squared field increment, has median 1.54 with 66.2 percent above 1 when normalized by the squared field and 1.39 with 65.6 percent raw, and follows the associator at every offset (1.11 and 1.08 at 12 rows). The ratio is not specific to the rows before the crossing: mirrored over the 22 rows after it, near six over far six, the associator median is 1.65 with 69.4 percent above 1. The raw increment energy shows the shape: its median over crossings is 6.4 nT squared 100 rows before, 13.0 at 10 rows, 22.1 at 5 rows, 50.7 at the crossing, 31.0 at 5 rows after and 7.9 at 100 rows after, against 0.17 to 0.18 at random times, and it exceeds half of its peak above the 100-row level from 4 rows before to 5 rows after. The ratio is the flank of a peak of magnetic fluctuation 10 rows wide at half maximum centered on the catalogued time, seen from either side. The claim's mean is not informative: the mean associator ratio of the random-time controls lies between 2.2 and 15.6 over the offsets, since single small early means dominate it. C-1619 mixes a replicated number with a falsified reading and becomes Superseded; the successor keeps the number and states what it measures."
unresolved_assumptions = ["One probe of one catalog at 3-second cadence; windows of 8 rows by 4 channels at 32 dimensions.", "The catalog classifies crossings from the same magnetometer downsampled to 24 seconds, with a Bz-rate and an ion-density criterion met inside a 60-second interval (Staples et al. 2020, section 3.1), so the width of the peak is not separated from the timing resolution of the labels.", "Two day files (2007 day 144 and 2009 day 174, 7 crossings) are skipped because the reader rejects a file with one malformed record, as B-themis-cd-crossing-survey does; 28 crossings lie within 120 rows of the start of their file.", "Nine windows hold a cadence step above 1.5 times the file median; without them the median is 1.4423.", "Crossings with no other catalogued crossing within 120 rows (2153) have medians 1.55 before and 1.68 after; the others (7302) 1.40 and 1.64. The direction of each crossing is not separated here, so the pooled excess of the ratio after the crossing over the ratio before it is not attributed to either side.", "The later benchmark family on the same catalog (C-1628 to C-1754) scores detectors per sample against rows within 2 minutes of a crossing and is not tested by this transition."]

exercised_falsifier = "B-lbm-cd-precursor-null on the run of C-1617 (16-cubed D3Q19 BGK lattice, relaxation time 0.7, Gaussian density peak at rest, contrasts 21 to 25). The reading of C-1617, that the growth of the associator norm and its late-to-early ratio indicate the approach of a positivity violation, stays standing if the ratio is absent or smaller at cells that hold no negative population, absent in runs that stay positive over the same number of steps, larger than the ratio of a product-free norm of the same vectors, and independent of which basis element each lattice direction is written to. It is falsified when cells and runs without a violation show the same or a larger ratio, when a product-free norm reproduces it, and when the ratio moves with the slot assignment."
proposed_claim_status = "Superseded"
rationale = "C-1617 states a measurement and a reading of it. The measurement replicates: the first negative population appears at step 5 at every contrast from 21 to 25, the late-to-early ratio at the first violating cell is 1.939, 1.919, 1.933, 1.914 and 1.915, and the mean associator norm over the 7 face-neighbor vectors reaches 0.0790 at step 5 at contrast 23 (1.91 to 1.94 and 7.9e-2 as registered). The series behind the ratio holds 6 states and 4 norms, so the ratio is the mean of the last two norms over the mean of the first two. The reading does not survive four controls. At contrast 23 the 776 cells that hold a negative population at step 5 have a median ratio of 1.69 and the 3320 cells that hold none have a median of 2.35, with 0.89 of them above 1.1. Runs at contrasts 2, 5, 10 and 15 hold no negative population over the same 5 steps; their median ratio over all cells is 1.39, 1.58, 1.84 and 1.97, the ratio at the same cell is 0.87, 1.16, 1.55 and 1.76, and the neighbor-cell mean rises from 1e-16 at step 0 to 0.0012, 0.0083, 0.028 and 0.050 at step 5, so the growth from zero and the ratio both vary smoothly with contrast and neither changes where a population first turns negative. The ratio of the departure norm, the distance of the cell's unit vector from its initial value, is 1.86 to 1.92 at the same cell, against 1.03 to 1.08 for the step-to-step difference norm, so the associator ratio is the departure ratio. Writing the same 19 populations to other slots of the 32-vector gives 0.88, 0.97, 1.07, 1.15, 1.35 and 1.39 at contrast 23 against 1.93 for the identity order, and the lattice does not fix that order. Every cell starts on the same unit vector, because a fluid at rest in equilibrium holds populations proportional to the lattice weights, which is why every norm starts at zero. The statement's last sentence, that the signal indicates accumulation of third-order Mach truncation error, is not supported by a statistic that non-violating cells and stable runs share. C-1617 mixes replicated numbers with a falsified reading and becomes Superseded; the successor keeps the numbers and states what they measure."
unresolved_assumptions = ["One grid size, one relaxation time and one initial condition; the violation occurs at step 5, inside the initial transient of a density contrast above 20.", "The six alternative slot assignments are five affine maps and the reversed order, a sample of the injective maps of 19 populations into 32 slots.", "The ranking of violating cells uses states up to step 4 only and one threshold-free score per quantity; no detector with a threshold or lead time is evaluated.", "The associator is first order in the increment for vectors without a repeated-block structure at dimension 16 and above; that reading rests on a scaling measurement outside this repository and is not asserted by the successor."]

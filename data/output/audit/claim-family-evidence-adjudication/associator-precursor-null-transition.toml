[[successor]]
proposal_key = "ace-associator-ratio-windowed-increment-energy"
statement = "On the ACE MFI 16-second magnetic field record of December 2004 and January 2005 (334502 valid rows, 32D unit-normalized delay windows of 8 samples by 4 channels), the sliding Cayley-Dickson associator norm follows the windowed increment energy, the sum over the window of the squared field increment over the squared field magnitude, with Spearman rank correlation 0.972. Its late-to-early ratio over the 12 norms before a local maximum above the 95th percentile has median 2.41 and mean 4.30 over 4470 peaks when the window ends at the peak, and median 1.13 when the window ends 10 indices earlier and shares no sample with the peak's triple (1.05 at 20 indices). A phase-randomized copy scores 1.23 and 1.07 at those two offsets, and the record's increments in random order score 3.00 and 1.17. The ratio at the peak is therefore the overlap of the windows with a heavy-tailed increment (kurtosis 90.6 for the Bx increments against 3.0 for the phase-randomized copy), and it is reproduced without temporal structure. The record's clustering of large increments appears in the raw increment energy: its median over peaks stands at 2.47 times the record's median 24 samples before a peak and at 3.62 times one sample before, while over the same 24 samples both randomized series stay between 0.85 and 1.04."
initial_status = "Provisional"
source_or_implementation_boundary = "Computational statement about one retained interval and one embedding, produced by B-cd-precursor-null. It attributes nothing to the Cayley-Dickson product: the same ranking comes from a sum of squared increments. It asserts nothing about other intervals, cadences, window lengths or percentile thresholds, nothing about C-1617 or C-1619, and no forecast skill: a raised increment energy before an event is a property of the record's intermittency, measured after the fact."
required_falsifier = "A rerun of B-cd-precursor-null on the same interval and seed whose record ratios, Spearman correlation or raw-energy profile leave the retained output by more than rounding; an overlap-free ratio of the record that exceeds its phase-randomized and shuffled-increment values by more than their spread over 20 seeds; or a labeled event catalog on which the associator norm separates events from non-events better than the windowed increment energy beyond a bootstrap interval."
where_stated = ["data/output/audit/claim-family-evidence-adjudication/associator-precursor-null.json", "data/output/audit/claim-family-evidence-adjudication/associator-precursor-null-transition.toml", "crates/gororoba_cli_physics/src/bin/cd_precursor_null.rs"]
evidence_artifact_ids = ["LOCAL-ASSOCIATOR-PRECURSOR-NULL"]
predecessor_relation_kind = "supersedes"

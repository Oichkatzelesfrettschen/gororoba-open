evidence_artifact_ids = ["LOCAL-ASSOCIATOR-PRECURSOR-NULL"]
exercised_falsifier = "B-cd-precursor-null on the ACE MFI 16-second record of December 2004 and January 2005, seed 20261114. The reading of C-1618, that the ratio is a precursor buildup which the Cayley-Dickson associator detects, stays standing if the late-to-early ratio keeps its size when its 12-norm window shares no sample with the peak's own triple, if the record's increments in random order score near 1, and if the associator norm departs from the product-free windowed increment energy. It is falsified when the ratio falls to the level of the nulls without shared samples, when the shuffled increments reproduce it, and when the norm follows the increment energy in rank."
proposed_claim_status = "Superseded"
rationale = "C-1618 states a measurement and a reading of it. The measurement replicates: 334502 rows, 334494 windows, ratio mean 4.30 and median 2.41 over 4470 peaks (4471 and 2.40 as registered; B-cd-domain-survey admits a tie with the left neighbor as a peak and takes nearest-rank percentiles, where B-cd-precursor-null requires a strict rise and interpolates). The reading does not survive three removals. An associator at index q reads samples q to q+9, so the 12 norms before a peak at index p read samples up to p+8 and the late six hold the event; with the window moved back 10 indices, so that no sample is shared, the median ratio is 1.13 against 1.07 for a phase-randomized copy. The record's own increments in random order, which hold no order in time, score a median of 3.00 at offset 0, above the record. The associator norm follows the windowed increment energy, the sum over 8 samples of the squared field increment over the squared field magnitude, with Spearman 0.972, so no product is needed for the signal. The statement compares the ratio with the 1.92 of C-1617 and states no null; the phase-randomized copy scores 1.23 at offset 0, so a ratio above 1 is expected of any series under this peak selection. The statement calls the ratio early-to-late while cd-domain-survey computes late over early, as this transition does. The TeraScale-2 sentence is not tested here and is not carried forward. C-1618 mixes a replicated number with a falsified reading and becomes Superseded; the successor keeps the number and states what it measures. The statement's label, the 2004 Halloween storm, does not match the interval of its input, December 2004 and January 2005."
unresolved_assumptions = ["One two-month interval of one spacecraft at 16-second cadence, 8-by-4 unit-normalized windows, peaks above the 95th percentile.", "The shuffled-increment series subtracts a 225-sample running mean to bound the walk; its offset-10 ratio of 1.17 reflects the selection of weak-field intervals by the unit normalization, visible in its field-magnitude profile.", "C-1617 (LBM) and C-1619 (THEMIS crossings) use the same 12-norm window before an event and have no overlap-free or product-free baseline; neither is tested by this transition.", "The identification with the partial variance of increments of solar-wind studies rests on the definition as given in abstracts of Greco et al.; the paper was not read."]

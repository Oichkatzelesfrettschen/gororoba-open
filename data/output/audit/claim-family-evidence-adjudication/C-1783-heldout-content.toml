statement = "In BGK D3Q19 runs of a Gaussian density peak at rest (16-cubed grid, relaxation time 0.7, contrasts 21 to 25), with each cell's 19 populations written in lattice order to a unit 32-vector, the late-to-early ratio of the sliding Cayley-Dickson associator norm at the first cell to hold a negative population is 1.91 to 1.94 over the 4 norms of steps 0 to 5. The same ratio is larger at cells that hold no negative population at step 5 (median 2.35 against 1.69 at contrast 23) and is present in runs that never hold a negative population over 400 steps (median over all cells 1.39, 1.58 and 1.84 at contrasts 2, 5 and 10, growing with contrast; 1.97 at contrast 15, which turns negative at step 6). It lies within 0.08 of the ratio of the departure norm, the distance of the cell vector from its initial value (1.86 to 1.92), and it ranges from 0.88 to 1.94 over seven assignments of the populations to slots. The ratio therefore measures departure from the uniform initial state under one slot assignment and does not indicate a positivity violation. Among quantities at step 4, the last associator norm ranks the cells that turn negative at step 5 with area under the ROC curve 0.90, 0.92 and 0.93 at contrasts 21, 23 and 25; the departure norm ranks them at 0.95, 0.98 and 0.99, the local Mach number at 0.97, 0.98 and 0.99, and the smallest population over the density at 0.97, 0.99 and 0.99. On six shear-layer runs (64 by 64 by 4 grid, relaxation times 0.5005 and 0.502) held out of the development runs of the late-failure forecast rules P13a to P13c, the preregistered rule P13d held: in 0 of 12 decided (run, quartile) pairs, drawn from the three runs that give pairs and none skipped, did the associator's oriented ROC area exceed both the 0.95 quantile of its symmetry-orbit null and the best of five product-free areas plus 0.02."

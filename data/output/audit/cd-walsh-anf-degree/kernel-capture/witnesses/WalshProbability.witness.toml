[[declarations]]
name = "integer_cube_sum_add"
statement = "Lemma integer_cube_sum_add : forall order first second, integer_cube_sum order (fun input => first input + second input) = integer_cube_sum order first + integer_cube_sum order second"
assumptions = []

[[declarations]]
name = "integer_cube_sum_constant"
statement = "Lemma integer_cube_sum_constant : forall order value, integer_cube_sum order (fun _ => value) = Z.of_nat (Nat.pow 2 order) * value"
assumptions = []

[[declarations]]
name = "walsh_slices"
statement = "Lemma walsh_slices : forall order function frequency high, walsh (S order) function (frequency, high) = walsh order (fun input => function (input, false)) frequency + phase_sign high * walsh order (fun input => function (input, true)) frequency"
assumptions = []

[[declarations]]
name = "walsh_parseval_integer"
statement = "Theorem walsh_parseval_integer : forall order function, integer_cube_sum order (fun frequency => walsh order function frequency ^ 2) = Z.of_nat (Nat.pow 2 order) ^ 2"
assumptions = []

[[declarations]]
name = "cube_dot_xor"
statement = "Lemma cube_dot_xor : forall order (left right input : cube order), cube_dot order (cube_xor order left right) input = xorb (cube_dot order left input) (cube_dot order right input)"
assumptions = []

[[declarations]]
name = "cube_dot_zero"
statement = "Lemma cube_dot_zero : forall order input, cube_dot order (cube_zero order) input = false"
assumptions = []

[[declarations]]
name = "walsh_character_sum"
statement = "Theorem walsh_character_sum : forall order (frequency : cube order), integer_cube_sum order (fun input => phase_sign (cube_dot order frequency input)) = if cube_equal order frequency (cube_zero order) then Z.of_nat (Nat.pow 2 order) else 0"
assumptions = []

[[declarations]]
name = "walsh_character_orthogonality"
statement = "Theorem walsh_character_orthogonality : forall order (left right : cube order), integer_cube_sum order (fun input => phase_sign (cube_dot order left input) * phase_sign (cube_dot order right input)) = if cube_equal order left right then Z.of_nat (Nat.pow 2 order) else 0"
assumptions = []

[[declarations]]
name = "real_cube_sum_ext"
statement = "Lemma real_cube_sum_ext : forall order first second, (forall input, first input = second input) -> real_cube_sum order first = real_cube_sum order second"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[declarations]]
name = "real_cube_sum_scale"
statement = "Lemma real_cube_sum_scale : forall order factor function, real_cube_sum order (fun input => factor * function input) = factor * real_cube_sum order function"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "real_cube_sum_IZR"
statement = "Lemma real_cube_sum_IZR : forall order function, real_cube_sum order (fun input => IZR (function input)) = IZR (integer_cube_sum order function)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "IZR_square"
statement = "Lemma IZR_square : forall value, IZR (value ^ 2) = IZR value ^ 2"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "walsh_probability"
statement = "Definition walsh_probability order function frequency := IZR (walsh order function frequency) ^ 2 / INR (Nat.pow 2 order) ^ 2"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "cube_cardinality_positive"
statement = "Lemma cube_cardinality_positive : forall order, 0 < INR (Nat.pow 2 order)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "walsh_probability_nonnegative"
statement = "Theorem walsh_probability_nonnegative : forall order function frequency, 0 <= walsh_probability order function frequency"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "walsh_probability_total"
statement = "Theorem walsh_probability_total : forall order function, real_cube_sum order (walsh_probability order function) = 1"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "cube_points_sum"
statement = "Lemma cube_points_sum : forall order function, real_sum (map function (cube_points order)) = real_cube_sum order function"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "walsh_law"
statement = "Definition walsh_law order function : list (cube order * R) := map (fun frequency => (frequency, walsh_probability order function frequency)) (cube_points order)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "walsh_law_nonnegative"
statement = "Theorem walsh_law_nonnegative : forall order function, nonnegative_law (walsh_law order function)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "walsh_law_normalized"
statement = "Theorem walsh_law_normalized : forall order function, normalized_law (walsh_law order function)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "walsh_probability_parity_extension"
statement = "Theorem walsh_probability_parity_extension : forall order function coefficient frequency high, walsh_probability (S order) (fun input => xorb (function (fst input)) (andb (snd input) coefficient)) (frequency, high) = if Bool.eqb high coefficient then walsh_probability order function frequency else 0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[successor]]
proposal_key = "sedenion-coordinate-hyperplane-octonion-subalgebras"
statement = "For u in 1..15 let in_sub u be the real span of the 8 basis units of the 16D (sedenions) whose index k has even parity of (u land k), under the Cayley-Dickson product sed_mul over the reals. All 15 spans are closed under the product and pairwise distinct (C029_family_closed, C029_family_distinct). Exactly the 8 spans with u <= 8 are isomorphic to the octonions through an explicit linear product-preserving map; each of the 7 spans with 9 <= u <= 15 contains a pair violating left alternativity (C029_octonion_subalgebra_iff, C029_octonion_subalgebra_count). The high-half image and the diagonal image of the octonions are not closed under the product (C029_high_half_not_closed, C029_diagonal_not_closed, C029_FermionGenerationArithmetic.C029_hi_image_not_closed, C029_diag_image_not_closed). The statement classifies this family of 15 and asserts nothing about other subalgebras, about C tensor S, or about fermion generations."
initial_status = "Provisional"
source_or_implementation_boundary = "Formal statement over the real sedenions of gororoba-math rocq/open (Sedenion.v, product sed_mul) at the commit and file digests of data/output/audit/formal-proof-scope/source-map.toml. It does not prove that every octonion subalgebra, or every unit-spanned one, is among the 15, and it carries no physical interpretation."
required_falsifier = "A compile or kernel-check failure of C029_SedenionOctonionSubalgebras.v or C029_FermionGenerationArithmetic.v at the recorded commit, a Print Assumptions replay of the cited theorems that lists an axiom outside the ledger rocq/open/kernel-assumptions.txt, or an exact computation in the same product that finds a member of the family not closed, or a span with u <= 8 that violates alternativity, refutes the statement."
where_stated = ["data/output/audit/formal-proof-scope/source-map.toml"]
evidence_artifact_ids = ["LOCAL-FORMAL-PROOF-SCOPE"]
predecessor_relation_kind = "supersedes"


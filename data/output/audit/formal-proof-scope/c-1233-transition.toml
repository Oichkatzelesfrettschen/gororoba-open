[[successor]]
proposal_key = "chern-integral-reflection-cancellation-conditional"
statement = "Let chern_integral be a real functional on functions R -> R -> R satisfying the declared axiom that pointwise cancellation of F and G implies chern_integral F + chern_integral G = 0. Then every F with F kx ky = - F (-kx) (-ky) satisfies chern_integral F + chern_integral (reflected F) = 0, where reflected F kx ky = F (-kx) (-ky) (C1233_ChernSumZero.chern_sum_zero_under_trs, resting on TightBindingTopology.chern_integral_linear). The statement is conditional on the axiom, does not assert chern_integral F = 0, and concerns no Hamiltonian, band count or inversion symmetry."
initial_status = "Provisional"
source_or_implementation_boundary = "Formal statement in gororoba-math rocq/open/verified/C1233_ChernSumZero.v over the Parameters and Axioms of TightBindingTopology.v, at the commit and digests of data/output/audit/formal-proof-scope/source-map.toml. No conformance of crates/quantum_core/src/tight_binding.rs (band_chern_number) to the axiom is asserted."
required_falsifier = "A compile or kernel-check failure of the two files at the pinned commit, or a Print Assumptions replay of chern_sum_zero_under_trs that lists an axiom other than chern_integral_linear, the Parameter chern_integral and the axioms of the ledger rocq/open/kernel-assumptions.txt, refutes the statement as scoped."

rationale = "chern_sum_zero_under_trs states that a real function F with F kx ky = - F (-kx) (-ky) satisfies chern_integral F + chern_integral (reflected F) = 0. chern_integral is a Parameter, and the theorem is the Axiom chern_integral_linear applied to F and its reflection; no axiom equates the integral of the reflected field with that of F, so the theorem does not state chern_integral F = 0. The file defines no Hamiltonian, band or inversion operation, and nothing ties band_chern_number of quantum_core to the axiom. The claim sentence also names inversion symmetry as the condition while the hypothesis is the time-reversal relation; inversion symmetry alone does not force a vanishing Chern number. The method cannot support the claim as stated, so C-1233 becomes Superseded and the successor states the conditional theorem with its axioms."

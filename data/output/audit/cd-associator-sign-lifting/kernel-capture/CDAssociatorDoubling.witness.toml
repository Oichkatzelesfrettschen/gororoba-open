[[declarations]]
name = "associator_phase"
statement = "Definition associator_phase order (left middle right : cube order) : bool := xorb (schreier order left middle right) (sign_exponent order left middle)"
assumptions = []

[[declarations]]
name = "commutation_phase"
statement = "Definition commutation_phase order (left right : cube order) : bool := xorb (sign_exponent order left right) (sign_exponent order right left)"
assumptions = []

[[declarations]]
name = "sign_doubling"
statement = "Theorem sign_doubling : forall order (left right : cube order) left_high right_high, sign_exponent (S order) (left, left_high) (right, right_high) = xorb (sign_exponent order left right) (xorb (andb right_high (commutation_phase order left right)) (xorb (andb left_high (cube_nonzero order right)) (andb left_high right_high)))"
assumptions = []

[[declarations]]
name = "associator_doubling"
statement = "Theorem associator_doubling : forall order (left middle right : cube order) left_high middle_high right_high, associator_phase (S order) (left, left_high) (middle, middle_high) (right, right_high) = xorb (associator_phase order left middle right) (xorb (andb left_high (xorb (cube_nonzero order middle) (xorb (cube_nonzero order right) (cube_nonzero order (cube_xor order middle right))))) (xorb (andb middle_high (xorb (commutation_phase order left middle) (commutation_phase order left (cube_xor order middle right)))) (andb right_high (xorb (commutation_phase order (cube_xor order left middle) right) (xorb (commutation_phase order middle right) (commutation_phase order left (cube_xor order middle right)))))))"
assumptions = []

[[declarations]]
name = "pair_coefficient"
statement = "Definition pair_coefficient order (left right : cube order) := xorb (cube_nonzero order left) (xorb (cube_nonzero order right) (cube_nonzero order (cube_xor order left right)))"
assumptions = []

[[declarations]]
name = "lower_pair_lifting"
statement = "Theorem lower_pair_lifting : forall order (left middle right : cube order) high, associator_phase (S order) (left, false) (middle, false) (right, high) = xorb (associator_phase order left middle right) (andb high (pair_coefficient order left middle))"
assumptions = []

[[declarations]]
name = "xor_nonzero_of_distinct"
statement = "Lemma xor_nonzero_of_distinct : forall order (left right : cube order), left <> right -> cube_nonzero order (cube_xor order left right) = true"
assumptions = []

[[declarations]]
name = "independent_pair_coefficient"
statement = "Theorem independent_pair_coefficient : forall order (left right : cube order), cube_nonzero order left = true -> cube_nonzero order right = true -> left <> right -> pair_coefficient order left right = true"
assumptions = []

[[declarations]]
name = "phase_sign"
statement = "Definition phase_sign (phase : bool) : Z := if phase then -1 else 1"
assumptions = []

[[declarations]]
name = "phase_sign_xor"
statement = "Lemma phase_sign_xor : forall left right, phase_sign (xorb left right) = phase_sign left * phase_sign right"
assumptions = []

[[declarations]]
name = "independent_pair_cancellation"
statement = "Theorem independent_pair_cancellation : forall order (left middle right : cube order), cube_nonzero order left = true -> cube_nonzero order middle = true -> left <> middle -> phase_sign (associator_phase (S order) (left, false) (middle, false) (right, false)) + phase_sign (associator_phase (S order) (left, false) (middle, false) (right, true)) = 0"
assumptions = []

[[declarations]]
name = "walsh"
statement = "Definition walsh order (function : cube order -> bool) (frequency : cube order) : Z := integer_cube_sum order (fun input => phase_sign (xorb (function input) (cube_dot order frequency input)))"
assumptions = []

[[declarations]]
name = "integer_cube_sum_ext"
statement = "Lemma integer_cube_sum_ext : forall order first second, (forall input, first input = second input) -> integer_cube_sum order first = integer_cube_sum order second"
assumptions = []

[[declarations]]
name = "integer_cube_sum_scale"
statement = "Lemma integer_cube_sum_scale : forall order factor function, integer_cube_sum order (fun input => factor * function input) = factor * integer_cube_sum order function"
assumptions = []

[[declarations]]
name = "walsh_parity_extension"
statement = "Theorem walsh_parity_extension : forall order function coefficient frequency frequency_high, walsh (S order) (fun input => xorb (function (fst input)) (andb (snd input) coefficient)) (frequency, frequency_high) = if Bool.eqb frequency_high coefficient then 2 * walsh order function frequency else 0"
assumptions = []

[[declarations]]
name = "associator_walsh_lifting"
statement = "Theorem associator_walsh_lifting : forall order (left middle frequency : cube order) frequency_high, walsh (S order) (fun input => associator_phase (S order) (left, false) (middle, false) input) (frequency, frequency_high) = if Bool.eqb frequency_high (pair_coefficient order left middle) then 2 * walsh order (associator_phase order left middle) frequency else 0"
assumptions = []

[[declarations]]
name = "degenerate_pair_coefficient"
statement = "Theorem degenerate_pair_coefficient : forall order (value : cube order), pair_coefficient order (cube_zero order) value = false /\\ pair_coefficient order value (cube_zero order) = false /\\ pair_coefficient order value value = false"
assumptions = []

[[declarations]]
name = "quaternion_pair_zero"
statement = "Example quaternion_pair_zero : forall input : cube 2, associator_phase 2 ((tt, true), false) ((tt, false), true) input = false"
assumptions = []

[[declarations]]
name = "octonion_pair_parity"
statement = "Example octonion_pair_parity : forall input : cube 2, forall high, associator_phase 3 (((tt, true), false), false) (((tt, false), true), false) (input, high) = high"
assumptions = []

[[declarations]]
name = "degenerate_walsh_slice"
statement = "Example degenerate_walsh_slice : walsh 1 (fun _ => false) (tt, true) = 0"
assumptions = []

[[witness.declarations]]
name = "same_coset"
statement = "Definition same_coset order (group : xor_subgroup order) (left right : cube order) := subgroup_member group (cube_xor order left right)"
assumptions = []

[[witness.declarations]]
name = "same_coset_reflexive"
statement = "Lemma same_coset_reflexive : forall order group (input : cube order), same_coset order group input input = true"
assumptions = []

[[witness.declarations]]
name = "same_coset_symmetric"
statement = "Lemma same_coset_symmetric : forall order group (left right : cube order), same_coset order group left right = same_coset order group right left"
assumptions = []

[[witness.declarations]]
name = "cube_xor_associative"
statement = "Lemma cube_xor_associative : forall order (first middle last : cube order), cube_xor order first (cube_xor order middle last) = cube_xor order (cube_xor order first middle) last"
assumptions = []

[[witness.declarations]]
name = "same_coset_transitive"
statement = "Lemma same_coset_transitive : forall order group (first middle last : cube order), same_coset order group first middle = true -> same_coset order group middle last = true -> same_coset order group first last = true"
assumptions = []

[[witness.declarations]]
name = "cube_points_complete"
statement = "Lemma cube_points_complete : forall order (input : cube order), In input (cube_points order)"
assumptions = []

[[witness.declarations]]
name = "coset_minimum_member"
statement = "Lemma coset_minimum_member : forall order group input candidates seed, same_coset order group input seed = true -> same_coset order group input (coset_minimum order group input candidates seed) = true"
assumptions = []

[[witness.declarations]]
name = "coset_minimum_seed_bound"
statement = "Lemma coset_minimum_seed_bound : forall order group input candidates seed, cube_encode order (coset_minimum order group input candidates seed) <= cube_encode order seed"
assumptions = []

[[witness.declarations]]
name = "coset_minimum_candidate_bound"
statement = "Lemma coset_minimum_candidate_bound : forall order group input candidates seed candidate, In candidate candidates -> same_coset order group input candidate = true -> cube_encode order (coset_minimum order group input candidates seed) <= cube_encode order candidate"
assumptions = []

[[witness.declarations]]
name = "coset_representative"
statement = "Definition coset_representative order group (input : cube order) := coset_minimum order group input (cube_points order) input"
assumptions = []

[[witness.declarations]]
name = "coset_representative_member"

assumptions = []

[[witness.declarations]]
name = "coset_representative_minimal"
statement = "Theorem coset_representative_minimal : forall order group input candidate, same_coset order group input candidate = true -> cube_encode order (coset_representative order group input) <= cube_encode order candidate"
assumptions = []

[[witness.declarations]]
name = "same_coset_representatives"
statement = "Theorem same_coset_representatives : forall order group (left right : cube order), same_coset order group left right = true -> coset_representative order group left = coset_representative order group right"
assumptions = []


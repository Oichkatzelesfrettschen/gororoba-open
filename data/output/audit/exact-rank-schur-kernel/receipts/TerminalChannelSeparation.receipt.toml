[[witness.declarations]]
name = "binary_channel"
statement = "Definition binary_channel (false_positive true_positive input_mean : Q) : Q := false_positive * (1 - input_mean) + true_positive * input_mean"
assumptions = []

[[witness.declarations]]
name = "binary_channel_contracts_separation"
statement = "Theorem binary_channel_contracts_separation : forall false_positive true_positive first_mean second_mean, 0 <= false_positive <= 1 -> 0 <= true_positive <= 1 -> Qabs (binary_channel false_positive true_positive first_mean - binary_channel false_positive true_positive second_mean) <= Qabs (first_mean - second_mean)"
assumptions = []

[[witness.declarations]]
name = "difference_radius_bound"
statement = "Theorem difference_radius_bound : forall first second first_center second_center first_radius second_radius, Qabs (first - first_center) <= first_radius -> Qabs (second - second_center) <= second_radius -> Qabs ((first - second) - (first_center - second_center)) <= first_radius + second_radius"
assumptions = []

[[witness.declarations]]
name = "separation_radius_bound"
statement = "Theorem separation_radius_bound : forall first second first_center second_center first_radius second_radius, Qabs (first - first_center) <= first_radius -> Qabs (second - second_center) <= second_radius -> Qabs (first - second) <= Qabs (first_center - second_center) + first_radius + second_radius"
assumptions = []


assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_zero"
statement = "Lemma sed_fold_zero : sed_fold sed_zero = sed_zero"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_product"
statement = "Definition sed_fold_product (left right : CDSed) : CDSed := sed_fold (sed_mul (sed_unfold left) (sed_unfold right))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_product_transport"
statement = "Theorem sed_fold_product_transport : forall left right, sed_fold_product (sed_fold left) (sed_fold right) = sed_fold (sed_mul left right)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_product_zero_iff"

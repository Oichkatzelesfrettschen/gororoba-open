[[witness.declarations]]
name = "tower_half_sum_reconstruction"
statement = "Lemma tower_half_sum_reconstruction order : forall first second, tower_add order (tower_scale order (1/2) (tower_add order first second)) (tower_scale order (1/2) (tower_sub order first second)) = first"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_half_difference_reconstruction"
statement = "Lemma tower_half_difference_reconstruction order : forall first second, tower_sub order (tower_scale order (1/2) (tower_add order first second)) (tower_scale order (1/2) (tower_sub order first second)) = second"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_average_reconstruction"
statement = "Lemma tower_average_reconstruction order : forall first second, tower_scale order (1/2) (tower_add order (tower_add order first second) (tower_sub order first second)) = first"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_detail_reconstruction"
statement = "Lemma tower_detail_reconstruction order : forall first second, tower_scale order (1/2) (tower_sub order (tower_add order first second) (tower_sub order first second)) = second"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_fold"
statement = "Definition tower_fold order (value : cd_tower (S order)) : cd_tower (S order) := (tower_scale order (1/2) (tower_add order (fst value) (snd value)), tower_scale order (1/2) (tower_sub order (fst value) (snd value)))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_unfold"
statement = "Definition tower_unfold order (value : cd_tower (S order)) : cd_tower (S order) := (tower_add order (fst value) (snd value),tower_sub order (fst value) (snd value))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "tower_unfold_after_fold"
statement = "Theorem tower_unfold_after_fold order value : tower_unfold order (tower_fold order value) = value"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_fold_after_unfold"
statement = "Theorem tower_fold_after_unfold order value : tower_fold order (tower_unfold order value) = value"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_fold_injective"
statement = "Theorem tower_fold_injective order first second : tower_fold order first = tower_fold order second -> first = second"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_fold_zero"
statement = "Theorem tower_fold_zero order : tower_fold order (tower_zero (S order)) = tower_zero (S order)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_fold_eq_zero"
statement = "Theorem tower_fold_eq_zero order value : tower_fold order value = tower_zero (S order) <-> value = tower_zero (S order)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_fold_product"
statement = "Definition tower_fold_product order first second := tower_fold order (tower_mul (S order) (tower_unfold order first) (tower_unfold order second))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_fold_product_correspondence"
statement = "Theorem tower_fold_product_correspondence order first second : tower_fold_product order (tower_fold order first) (tower_fold order second) = tower_fold order (tower_mul (S order) first second)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_fold_zero_product"
statement = "Theorem tower_fold_zero_product order first second : tower_fold_product order first second = tower_zero (S order) <-> tower_mul (S order) (tower_unfold order first) (tower_unfold order second) = tower_zero (S order)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_half_norm_identity"
statement = "Lemma tower_half_norm_identity order : forall first second, tower_norm_sq order (tower_scale order (1/2) (tower_add order first second)) + tower_norm_sq order (tower_scale order (1/2) (tower_sub order first second)) = (1/2) * (tower_norm_sq order first + tower_norm_sq order second)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "tower_fold_norm_scaling"

assumptions = []

[[witness.declarations]]
name = "associator_iterated_lifting"
statement = "Theorem associator_iterated_lifting : forall extra order (left middle input : cube order) tail, associator_phase (extra + order) (cube_embed order extra left) (cube_embed order extra middle) (cube_append order extra input tail) = xorb (associator_phase order left middle input) (andb (cube_parity extra tail) (pair_coefficient order left middle))"
assumptions = []

[[witness.declarations]]
name = "walsh_iterated_parity"
statement = "Theorem walsh_iterated_parity : forall extra order function coefficient frequency tail, walsh (extra + order) (parity_extension order extra function coefficient) (cube_append order extra frequency tail) = if cube_equal extra tail (constant_cube extra coefficient) then (Z.of_nat (Nat.pow 2 extra) * walsh order function frequency)%Z else 0%Z"
assumptions = []

[[witness.declarations]]

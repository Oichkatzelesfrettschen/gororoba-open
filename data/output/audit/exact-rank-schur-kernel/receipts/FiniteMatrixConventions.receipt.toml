statement = "Theorem right_kernel_transpose rows columns (operator : matrix.matrix scalar rows columns) (vector : matrix.matrix scalar columns 1) : matrix.mulmx operator vector = matrix_zero rows 1 <-> matrix.mulmx (matrix.trmx vector) (matrix.trmx operator) = matrix_zero 1 rows"
assumptions = []


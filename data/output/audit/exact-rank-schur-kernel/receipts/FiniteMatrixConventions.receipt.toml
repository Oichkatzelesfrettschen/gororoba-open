statement = "Theorem block_column_kernel rows_left rows_right columns_left columns_right (left : matrix.matrix scalar rows_left columns_left) (right : matrix.matrix scalar rows_right columns_right) (upper : matrix.matrix scalar columns_left 1) (lower : matrix.matrix scalar columns_right 1) : matrix.mulmx (matrix.block_mx left (matrix_zero scalar rows_left columns_right) (matrix_zero scalar rows_right columns_left) right) (matrix.col_mx upper lower) = matrix_zero scalar (ssrnat.addn rows_left rows_right) 1 <-> matrix.mulmx left upper = matrix_zero scalar rows_left 1 /\\ matrix.mulmx right lower = matrix_zero scalar rows_right 1"
assumptions = []


statement = "Theorem rational_rank_specialization (embedding : rings_modules_and_algebras.GRing.RMorphism.type (field_semiring mathcomp_rational_field) (field_semiring stdlib_real_field)) rows columns (rational_operator : matrix.matrix rat.rat rows columns) (real_operator : matrix.matrix R rows columns) : real_operator = matrix.map_mx (rings_modules_and_algebras.GRing.RMorphism.sort embedding) rational_operator -> @mxalgebra.mxrank stdlib_real_field rows columns real_operator = @mxalgebra.mxrank mathcomp_rational_field rows columns rational_operator"

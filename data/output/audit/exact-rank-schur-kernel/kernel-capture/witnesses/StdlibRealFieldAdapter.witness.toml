[[declarations]]
name = "real_find"
statement = "Definition real_find (predicate : R -> bool) (_ : nat) : option R := let chosen := epsilon (inhabits R0) (fun x => predicate x = true) in if predicate chosen then Some chosen else None"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic"]

[[declarations]]
name = "real_find_correct"
statement = "Lemma real_find_correct (predicate : R -> bool) n x : real_find predicate n = Some x -> predicate x"

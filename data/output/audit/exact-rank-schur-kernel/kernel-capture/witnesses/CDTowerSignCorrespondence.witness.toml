[[declarations]]
name = "tower_signed"
statement = "Definition tower_signed order (negative : bool) (value : cd_tower order) := if negative then tower_neg order value else value"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[declarations]]
name = "tower_signed_zero"
statement = "Lemma tower_signed_zero order negative : tower_signed order negative (tower_zero order) = tower_zero order"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "tower_signed_composition"
statement = "Lemma tower_signed_composition order first second value : tower_signed order first (tower_signed order second value) = tower_signed order (xorb first second) value"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "tower_signed_mul_left"
statement = "Lemma tower_signed_mul_left order negative first second : tower_mul order (tower_signed order negative first) second = tower_signed order negative (tower_mul order first second)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "tower_signed_mul_right"
statement = "Lemma tower_signed_mul_right order negative first second : tower_mul order first (tower_signed order negative second) = tower_signed order negative (tower_mul order first second)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "tower_signed_low"
statement = "Lemma tower_signed_low order negative value : tower_signed (S order) negative (value,tower_zero order) = (tower_signed order negative value,tower_zero order)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "tower_signed_high"
statement = "Lemma tower_signed_high order negative value : tower_signed (S order) negative (tower_zero order,value) = (tower_zero order,tower_signed order negative value)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "tower_basis_conjugation"
statement = "Theorem tower_basis_conjugation order : forall value, tower_conj order (tower_basis order value) = tower_signed order (cube_nonzero order value) (tower_basis order value)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "tower_basis_multiplication"
statement = "Theorem tower_basis_multiplication order : forall first second, tower_mul order (tower_basis order first) (tower_basis order second) = tower_signed order (sign_exponent order first second) (tower_basis order (cube_xor order first second))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "numeric_tower_basis_multiplication"
statement = "Theorem numeric_tower_basis_multiplication order fuel left right : (order <= fuel)%nat -> (left < Nat.pow 2 order)%nat -> (right < Nat.pow 2 order)%nat -> tower_mul order (tower_basis order (cube_decode order left)) (tower_basis order (cube_decode order right)) = tower_signed order (Z.eqb (M3IsAssociator.cd_sign_fuel fuel (Nat.pow 2 order) left right) (-1)) (tower_basis order (cube_decode order (Nat.lxor left right)))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

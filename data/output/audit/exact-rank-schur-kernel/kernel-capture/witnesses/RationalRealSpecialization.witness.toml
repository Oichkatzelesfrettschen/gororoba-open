[[declarations]]
name = "real_rational_fraction"
statement = "Lemma real_rational_fraction numerator denominator : real_rational (divq (ratz numerator) (ratz denominator)) = (IZR (integer_coordinate numerator) / IZR (integer_coordinate denominator))%R"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "rational_frame_real_complete"
statement = "Theorem rational_frame_real_complete rows columns width (operator : matrix.matrix rat rows columns) (frame : matrix.matrix rat columns width) : matrix.mulmx operator frame = FiniteMatrixConventions.matrix_zero mathcomp_rational_field rows width -> @mxalgebra.mxrank mathcomp_rational_field columns width frame = ssrnat.subn columns (@mxalgebra.mxrank mathcomp_rational_field rows columns operator) -> forall vector : matrix.matrix R columns 1, matrix.mulmx (matrix.map_mx real_rational operator) vector = FiniteMatrixConventions.matrix_zero stdlib_real_field rows 1 -> exists coefficients : matrix.matrix R width 1, vector = matrix.mulmx (matrix.map_mx real_rational frame) coefficients"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

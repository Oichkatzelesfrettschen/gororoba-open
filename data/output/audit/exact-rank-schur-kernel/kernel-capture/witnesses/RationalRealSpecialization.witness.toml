[[declarations]]
name = "integer_coordinate"
statement = "Definition integer_coordinate (value : int) : Z := match value with Posz natural => Z.of_nat natural | Negz natural => Z.opp (Z.of_nat (S natural)) end"
assumptions = []

[[declarations]]
name = "real_integer_IZR"
statement = "Lemma real_integer_IZR value : real_integer value = IZR (integer_coordinate value)"

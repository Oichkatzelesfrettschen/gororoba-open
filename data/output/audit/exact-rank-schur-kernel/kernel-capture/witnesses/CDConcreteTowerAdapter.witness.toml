[[declarations]]
name = "tower_quaternion"
statement = "Definition tower_quaternion (value : cd_tower 2) : CDQuat := mkQuat (fst (fst value)) (snd (fst value)) (fst (snd value)) (snd (snd value))"
assumptions = []

[[declarations]]
name = "quaternion_tower"
statement = "Definition quaternion_tower (value : CDQuat) : cd_tower 2 := ((qa value,qb value),(qc value,qd value))"
assumptions = []

[[declarations]]
name = "tower_octonion"
statement = "Definition tower_octonion (value : cd_tower 3) : CDOct := mkOct (tower_quaternion (fst value)) (tower_quaternion (snd value))"
assumptions = []

[[declarations]]
name = "octonion_tower"
statement = "Definition octonion_tower (value : CDOct) : cd_tower 3 := (quaternion_tower (oct_lo value),quaternion_tower (oct_hi value))"
assumptions = []

[[declarations]]
name = "tower_sedenion"
statement = "Definition tower_sedenion (value : cd_tower 4) : CDSed := mkSed (tower_octonion (fst value)) (tower_octonion (snd value))"
assumptions = []

[[declarations]]
name = "sedenion_tower"
statement = "Definition sedenion_tower (value : CDSed) : cd_tower 4 := (octonion_tower (sed_lo value),octonion_tower (sed_hi value))"
assumptions = []

[[declarations]]
name = "quaternion_tower_round_trip"

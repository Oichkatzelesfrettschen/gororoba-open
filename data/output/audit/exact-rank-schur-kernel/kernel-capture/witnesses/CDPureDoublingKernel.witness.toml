[[declarations]]
name = "tower_neg_eq_zero"
statement = "Lemma tower_neg_eq_zero order value : tower_neg order value = tower_zero order <-> value = tower_zero order"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "tower_conj_eq_zero"
statement = "Lemma tower_conj_eq_zero order value : tower_conj order value = tower_zero order <-> value = tower_zero order"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "pure_right_left_conjugacy"
statement = "Theorem pure_right_left_conjugacy order operand : tower_pure order operand -> forall vector, tower_mul order vector operand = tower_neg order (tower_conj order (tower_mul order operand (tower_conj order vector)))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "pure_right_left_kernel"
statement = "Theorem pure_right_left_kernel order operand : tower_pure order operand -> forall vector, tower_mul order vector operand = tower_zero order <-> tower_mul order operand (tower_conj order vector) = tower_zero order"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "tower_add_zero_right"
statement = "Lemma tower_add_zero_right order value : tower_add order value (tower_zero order) = value"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "zero_upper_half_product"
statement = "Theorem zero_upper_half_product order operand first second : tower_mul (S order) (operand,tower_zero order) (first,second) = (tower_mul order operand first,tower_mul order second operand)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "pure_doubling_kernel_decomposition"
statement = "Theorem pure_doubling_kernel_decomposition order operand first second : tower_pure order operand -> (tower_mul (S order) (operand,tower_zero order) (first,second) = tower_zero (S order) <-> tower_mul order operand first = tower_zero order /\\ tower_mul order operand (tower_conj order second) = tower_zero order)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "pure_kernel_pair_transport"
statement = "Definition pure_kernel_pair_transport order (pair : cd_tower order * cd_tower order) := (fst pair,tower_conj order (snd pair))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[declarations]]
name = "pure_kernel_pair_transport_involution"
statement = "Theorem pure_kernel_pair_transport_involution order pair : pure_kernel_pair_transport order (pure_kernel_pair_transport order pair) = pair"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "pure_kernel_pair_transport_membership"
statement = "Theorem pure_kernel_pair_transport_membership order operand (pair : cd_tower order * cd_tower order) : tower_pure order operand -> (tower_mul (S order) (operand,tower_zero order) (pure_kernel_pair_transport order pair) = tower_zero (S order) <-> tower_mul order operand (fst pair) = tower_zero order /\\ tower_mul order operand (snd pair) = tower_zero order)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "pure_operator_conjugacy"
statement = "Theorem pure_operator_conjugacy order operand : tower_pure order operand -> tower_right_matrix order operand = nmodule.Algebra.opp (matrix.mulmx (matrix.mulmx (tower_conjugation_matrix order) (tower_left_matrix order operand)) (tower_conjugation_matrix order))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "pure_right_left_rank"
statement = "Theorem pure_right_left_rank order operand : tower_pure order operand -> mxrank (tower_right_matrix order operand) = mxrank (tower_left_matrix order operand)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "zero_upper_half_matrix"
statement = "Theorem zero_upper_half_matrix order operand : tower_left_matrix (S order) (operand,tower_zero order) = matrix.block_mx (tower_left_matrix order operand) nmodule.Algebra.zero nmodule.Algebra.zero (tower_right_matrix order operand)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "pure_doubling_rank"
statement = "Theorem pure_doubling_rank order operand : tower_pure order operand -> mxrank (tower_left_matrix (S order) (operand,tower_zero order)) = ssrnat.addn (mxrank (tower_left_matrix order operand)) (mxrank (tower_left_matrix order operand))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "tower_left_nullity"
statement = "Definition tower_left_nullity order operand := ssrnat.subn (tower_dimension order) (mxrank (tower_left_matrix order operand))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "pure_doubling_nullity"
statement = "Theorem pure_doubling_nullity order operand : tower_pure order operand -> tower_left_nullity (S order) (operand,tower_zero order) = ssrnat.addn (tower_left_nullity order operand) (tower_left_nullity order operand)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "doubled_kernel_frame"
statement = "Definition doubled_kernel_frame order width (frame : matrix.matrix R (tower_dimension order) width) := matrix.block_mx frame nmodule.Algebra.zero nmodule.Algebra.zero (matrix.mulmx (tower_conjugation_matrix order) frame)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "conjugated_kernel_frame_residual"
statement = "Lemma conjugated_kernel_frame_residual order operand width (frame : matrix.matrix R (tower_dimension order) width) : tower_pure order operand -> matrix.mulmx (tower_left_matrix order operand) frame = nmodule.Algebra.zero -> matrix.mulmx (tower_right_matrix order operand) (matrix.mulmx (tower_conjugation_matrix order) frame) = nmodule.Algebra.zero"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "doubled_kernel_frame_residual"
statement = "Theorem doubled_kernel_frame_residual order operand width (frame : matrix.matrix R (tower_dimension order) width) : tower_pure order operand -> matrix.mulmx (tower_left_matrix order operand) frame = nmodule.Algebra.zero -> matrix.mulmx (tower_left_matrix (S order) (operand,tower_zero order)) (doubled_kernel_frame order width frame) = nmodule.Algebra.zero"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "conjugated_frame_rank"
statement = "Lemma conjugated_frame_rank order width (frame : matrix.matrix R (tower_dimension order) width) : mxrank (matrix.mulmx (tower_conjugation_matrix order) frame) = mxrank frame"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "doubled_kernel_frame_rank"
statement = "Theorem doubled_kernel_frame_rank order width (frame : matrix.matrix R (tower_dimension order) width) : mxrank frame = width -> mxrank (doubled_kernel_frame order width frame) = ssrnat.addn width width"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "doubled_kernel_frame_complete"
statement = "Theorem doubled_kernel_frame_complete order operand width (frame : matrix.matrix R (tower_dimension order) width) : tower_pure order operand -> matrix.mulmx (tower_left_matrix order operand) frame = nmodule.Algebra.zero -> mxrank frame = width -> width = tower_left_nullity order operand -> forall vector : matrix.matrix R (tower_dimension (S order)) 1, matrix.mulmx (tower_left_matrix (S order) (operand,tower_zero order)) vector = nmodule.Algebra.zero -> exists coefficients : matrix.matrix R (ssrnat.addn width width) 1, vector = matrix.mulmx (doubled_kernel_frame order width frame) coefficients"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalEpsilon.constructive_indefinite_description", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "terminal_radius"
statement = "Definition terminal_radius : R := 21 / 1000"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "terminal_sample_count"
statement = "Definition terminal_sample_count : R := 8192"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[declarations]]
name = "terminal_family"
statement = "Definition terminal_family : list nat := seq 0 32"
assumptions = []

[[declarations]]
name = "terminal_center"
statement = "Definition terminal_center {A} (parameters : nat -> R) (centered_sum : nat -> A -> R) (index : nat) (point : A) : R := parameters index + centered_sum index point / terminal_sample_count"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "terminal_radius_failure"
statement = "Definition terminal_radius_failure {A} (centered_sum : nat -> A -> R) (index : nat) (point : A) : bool := if Rle_dec (terminal_sample_count * terminal_radius) (Rabs (centered_sum index point)) then true else false"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "terminal_rejection"
statement = "Definition terminal_rejection {A} (parameters : nat -> R) (centered_sum : nat -> A -> R) (point : A) : bool := if Rlt_dec (Rabs (terminal_center parameters centered_sum 2%nat point - terminal_center parameters centered_sum 3%nat point) + 4 * terminal_radius) (Rabs (terminal_center parameters centered_sum 0%nat point - terminal_center parameters centered_sum 1%nat point)) then true else false"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "common_terminal_channel"
statement = "Definition common_terminal_channel (parameters : nat -> R) : Prop := exists false_positive true_positive, 0 <= false_positive <= 1 /\\ 0 <= true_positive <= 1 /\\ parameters 0%nat = binary_channel false_positive true_positive (parameters 2%nat) /\\ parameters 1%nat = binary_channel false_positive true_positive (parameters 3%nat)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[declarations]]
name = "terminal_radius_from_centered_sum"
statement = "Lemma terminal_radius_from_centered_sum {A} parameters centered_sum index (point : A) : terminal_radius_failure centered_sum index point = false -> Rabs (parameters index - terminal_center parameters centered_sum index point) <= terminal_radius"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "terminal_false_rejection_requires_radius_failure"
statement = "Theorem terminal_false_rejection_requires_radius_failure {A} parameters centered_sum (point : A) : common_terminal_channel parameters -> terminal_rejection parameters centered_sum point = true -> existsb (fun index => terminal_radius_failure centered_sum index point) terminal_family = true"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "terminal_false_rejection_probability"
statement = "Theorem terminal_false_rejection_probability {A} (law : list (A * R)) parameters centered_sum : nonnegative_law law -> common_terminal_channel parameters -> event_probability law (fun point => existsb (fun index => terminal_radius_failure centered_sum index point) terminal_family) <= 1 / 20 -> event_probability law (terminal_rejection parameters centered_sum) <= 1 / 20"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "terminal_32_mean_false_rejection"
statement = "Theorem terminal_32_mean_false_rejection {A} (law : list (A * R)) (parameters : nat -> R) (centered_sum : nat -> A -> R) : nonnegative_law law -> normalized_law law -> (forall index, In index terminal_family -> 0 <= parameters index <= 1) -> (forall index, In index terminal_family -> forall observable, weighted_expectation law (fun point => observable (centered_sum index point)) = bernoulli_expectation terminal_samples (parameters index) observable) -> common_terminal_channel parameters -> event_probability law (terminal_rejection parameters centered_sum) <= 1 / 20"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "retained_terminal_center"
statement = "Definition retained_terminal_center (index : nat) : R := match index with | 0%nat => 2964 / 8192 | 1%nat => 4911 / 8192 | 2%nat => 4067 / 8192 | 3%nat => 4057 / 8192 | _ => 0 end"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "retained_terminal_exact_margin"
statement = "Theorem retained_terminal_exact_margin : Rabs (retained_terminal_center 0%nat - retained_terminal_center 1%nat) - Rabs (retained_terminal_center 2%nat - retained_terminal_center 3%nat) - 4 * terminal_radius = 156109 / 1024000"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "retained_terminal_margin_positive"
statement = "Theorem retained_terminal_margin_positive : 0 < Rabs (retained_terminal_center 0%nat - retained_terminal_center 1%nat) - Rabs (retained_terminal_center 2%nat - retained_terminal_center 3%nat) - 4 * terminal_radius"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

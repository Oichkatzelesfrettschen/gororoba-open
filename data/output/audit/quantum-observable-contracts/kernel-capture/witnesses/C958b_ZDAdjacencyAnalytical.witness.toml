[[declarations]]
name = "is_giant_vertex"
statement = "Definition is_giant_vertex (dim v : N) : bool := negb (N.eqb v 0) && negb (N.eqb v (dim / 2))"
assumptions = []

[[declarations]]
name = "is_zd_edge"
statement = "Definition is_zd_edge (dim i j : N) : bool := is_giant_vertex dim i && is_giant_vertex dim j && negb (N.eqb (N.lxor i j) (dim / 2))"
assumptions = []

[[declarations]]
name = "analytical_edge_count"
statement = "Definition analytical_edge_count (dim : N) : N := count_edges_from dim 0 (N.to_nat dim)"
assumptions = []

[[declarations]]
name = "analytical_edges_16"
statement = "Theorem analytical_edges_16 : analytical_edge_count 16 = 84"
assumptions = []


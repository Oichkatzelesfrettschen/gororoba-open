[[declarations]]
name = "target_flip"
statement = "Definition target_flip (state : State) : State := if predicate state then toggle state else state"
assumptions = []

[[declarations]]
name = "target_flip_involutive"
statement = "Theorem target_flip_involutive : forall state, target_flip (target_flip state) = state"
assumptions = []

[[declarations]]
name = "target_flip_injective"
statement = "Theorem target_flip_injective : forall left right, target_flip left = target_flip right -> left = right"
assumptions = []

[[declarations]]
name = "target_flip_surjective"
statement = "Theorem target_flip_surjective : forall output, exists input, target_flip input = output"
assumptions = []

[[declarations]]
name = "masked_toggle_invariant"
statement = "Theorem masked_toggle_invariant : forall label mask toggle_mask, Nat.land mask toggle_mask = 0 -> Nat.land (Nat.lxor label toggle_mask) mask = Nat.land label mask"
assumptions = []

[[declarations]]
name = "cube_flip"
statement = "Definition cube_flip (target mask selected label : nat) : nat := target_flip (fun value => Nat.lxor value (2 ^ target)) (fun value => Nat.eqb (Nat.land value mask) selected) label"
assumptions = []

[[declarations]]
name = "cube_flip_involutive"
statement = "Theorem cube_flip_involutive : forall target mask selected, Nat.land mask (2 ^ target) = 0 -> forall label, cube_flip target mask selected (cube_flip target mask selected label) = label"
assumptions = []

[[declarations]]
name = "cube_flip_bijective"
statement = "Theorem cube_flip_bijective : forall target mask selected, Nat.land mask (2 ^ target) = 0 -> (forall left right, cube_flip target mask selected left = cube_flip target mask selected right -> left = right) /\\ (forall output, exists input, cube_flip target mask selected input = output)"
assumptions = []

[[declarations]]
name = "target_dependent_predicate_breaks_involution"
statement = "Theorem target_dependent_predicate_breaks_involution : cube_flip 0 1 0 (cube_flip 0 1 0 0) <> 0"
assumptions = []

[[declarations]]
name = "run_word_append"
statement = "Theorem run_word_append : forall State (first second : list (State -> State)) state, run_word (first ++ second) state = run_word second (run_word first state)"
assumptions = []

[[declarations]]
name = "reverse_word_inverse"
statement = "Theorem reverse_word_inverse : forall State (word : list (State -> State)), Forall (fun gate => forall state, gate (gate state) = state) word -> forall state, run_word (rev word) (run_word word state) = state"
assumptions = []

[[declarations]]
name = "word_reverse_inverse"
statement = "Theorem word_reverse_inverse : forall State (word : list (State -> State)), Forall (fun gate => forall state, gate (gate state) = state) word -> forall state, run_word word (run_word (rev word) state) = state"
assumptions = []

[[declarations]]
name = "controlled"
statement = "Definition controlled {State : Type} (action : State -> State) (control : bool) (state : State) := if control then action state else state"
assumptions = []

[[declarations]]
name = "disabled_control_identity"
statement = "Theorem disabled_control_identity : forall State (action : State -> State) state, controlled action false state = state"
assumptions = []

[[declarations]]
name = "enabled_control_action"
statement = "Theorem enabled_control_action : forall State (action : State -> State) state, controlled action true state = action state"
assumptions = []

[[declarations]]
name = "controlled_composition"
statement = "Theorem controlled_composition : forall State (first second : State -> State) control state, controlled second control (controlled first control state) = controlled (fun value => second (first value)) control state"
assumptions = []

[[declarations]]
name = "signed_apply"
statement = "Definition signed_apply (action : signed_xor_action) (phase : bool) (label : nat) : bool * nat := (xorb phase (action_phase action label), Nat.lxor label (action_offset action))"
assumptions = []

[[declarations]]
name = "signed_compose"
statement = "Definition signed_compose (first second : signed_xor_action) : signed_xor_action := SignedXor (Nat.lxor (action_offset first) (action_offset second)) (fun label => xorb (action_phase first label) (action_phase second (Nat.lxor label (action_offset first))))"
assumptions = []

[[declarations]]
name = "signed_composition_exact"
statement = "Theorem signed_composition_exact : forall first second phase label, let intermediate := signed_apply first phase label in signed_apply second (fst intermediate) (snd intermediate) = signed_apply (signed_compose first second) phase label"
assumptions = []

[[declarations]]
name = "controlled_signed"
statement = "Definition controlled_signed (action : signed_xor_action) (control phase : bool) (label : nat) := if control then signed_apply action phase label else (phase, label)"
assumptions = []

[[declarations]]
name = "controlled_signed_label"
statement = "Theorem controlled_signed_label : forall action control phase label, snd (controlled_signed action control phase label) = if control then Nat.lxor label (action_offset action) else label"
assumptions = []

[[declarations]]
name = "controlled_signed_phase"
statement = "Theorem controlled_signed_phase : forall action control phase label, fst (controlled_signed action control phase label) = xorb phase (andb control (action_phase action label))"
assumptions = []

[[declarations]]
name = "controlled_signed_disabled_identity"
statement = "Theorem controlled_signed_disabled_identity : forall action phase label, controlled_signed action false phase label = (phase, label)"
assumptions = []

[[declarations]]
name = "controlled_signed_composition"
statement = "Theorem controlled_signed_composition : forall first second control phase label, let intermediate := controlled_signed first control phase label in controlled_signed second control (fst intermediate) (snd intermediate) = controlled_signed (signed_compose first second) control phase label"
assumptions = []

[[declarations]]
name = "signed_word_label_projection"
statement = "Theorem signed_word_label_projection : forall word phase label, snd (run_signed_word word phase label) = Nat.lxor label (word_offset word)"
assumptions = []

[[declarations]]
name = "signed_xor_fixed_zero_label_identity"
statement = "Theorem signed_xor_fixed_zero_label_identity : forall action, snd (signed_apply action false 0) = 0 -> forall phase label, snd (signed_apply action phase label) = label"
assumptions = []

[[declarations]]
name = "signed_word_fixed_zero_label_identity"
statement = "Theorem signed_word_fixed_zero_label_identity : forall word, snd (run_signed_word word false 0) = 0 -> forall phase label, snd (run_signed_word word phase label) = label"
assumptions = []

[[declarations]]
name = "nonconstant_diagonal"
statement = "Definition nonconstant_diagonal := SignedXor 0 (fun label => Nat.testbit label 0)"
assumptions = []

[[declarations]]
name = "diagonal_phase_preserves_labels"
statement = "Theorem diagonal_phase_preserves_labels : forall phase label, snd (signed_apply nonconstant_diagonal phase label) = label"
assumptions = []

[[declarations]]
name = "diagonal_phase_is_nontrivial"
statement = "Theorem diagonal_phase_is_nontrivial : signed_apply nonconstant_diagonal false 0 = (false, 0) /\\ signed_apply nonconstant_diagonal false 1 = (true, 1)"
assumptions = []

[[declarations]]
name = "diagonal_control_relative_phase"
statement = "Theorem diagonal_control_relative_phase : controlled_signed nonconstant_diagonal false false 1 <> controlled_signed nonconstant_diagonal true false 1"
assumptions = []

[[declarations]]
name = "n21_multiplier"
statement = "Definition n21_multiplier (multiplier label : nat) : nat := if label <? 21 then (multiplier * label) mod 21 else label"
assumptions = []

[[declarations]]
name = "affine_on_five_bits"
statement = "Definition affine_on_five_bits (mapping : nat -> nat) : Prop := forall left right, left < 32 -> right < 32 -> mapping (Nat.lxor left right) = Nat.lxor (Nat.lxor (mapping left) (mapping right)) (mapping 0)"
assumptions = []

[[declarations]]
name = "n21_fixes_origin"
statement = "Theorem n21_fixes_origin : forall multiplier, n21_multiplier multiplier 0 = 0"
assumptions = []

[[declarations]]
name = "n21_moves_one"
statement = "Theorem n21_moves_one : forall multiplier, In multiplier [2; 4; 16] -> n21_multiplier multiplier 1 <> 1"
assumptions = []

[[declarations]]
name = "n21_nonaffine"
statement = "Theorem n21_nonaffine : forall multiplier, In multiplier [2; 4; 16] -> ~ affine_on_five_bits (n21_multiplier multiplier)"
assumptions = []

[[declarations]]
name = "n21_excludes_signed_xor_words"
statement = "Theorem n21_excludes_signed_xor_words : forall multiplier, In multiplier [2; 4; 16] -> forall word, ~ (forall label, label < 32 -> snd (run_signed_word word false label) = n21_multiplier multiplier label)"
assumptions = []

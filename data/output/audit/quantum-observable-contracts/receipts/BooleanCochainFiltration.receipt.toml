[[witness.declarations]]
name = "linear_substitution_preserves_degree"
statement = "Theorem linear_substitution_preserves_degree : forall polynomial substitution, (forall variable, polynomial_degree (substitution variable) <= 1) -> polynomial_degree (polynomial_substitute polynomial substitution) <= polynomial_degree polynomial"
assumptions = []

[[witness.declarations]]
name = "substitution_evaluation"
statement = "Theorem substitution_evaluation : forall polynomial substitution point, polynomial_evaluate (polynomial_substitute polynomial substitution) point = polynomial_evaluate polynomial (fun variable => polynomial_evaluate (substitution variable) point)"
assumptions = []

[[witness.declarations]]
name = "degree_at_most"
statement = "Definition degree_at_most (function : (nat -> bool) -> bool) (bound : nat) : Prop := exists polynomial, polynomial_degree polynomial <= bound /\\ forall point, polynomial_evaluate polynomial point = function point"
assumptions = []

[[witness.declarations]]
name = "addition_preserves_filtration"
statement = "Theorem addition_preserves_filtration : forall left right bound, degree_at_most left bound -> degree_at_most right bound -> degree_at_most (fun point => xorb (left point) (right point)) bound"
assumptions = []

[[witness.declarations]]
name = "linear_pullback_preserves_filtration"
statement = "Theorem linear_pullback_preserves_filtration : forall function bound substitution, degree_at_most function bound -> (forall variable, polynomial_degree (substitution variable) <= 1) -> degree_at_most (fun point => function (fun variable => polynomial_evaluate (substitution variable) point)) bound"
assumptions = []

[[witness.declarations]]
name = "cochain_differential_preserves_degree"
statement = "Theorem cochain_differential_preserves_degree : forall polynomial faces, Forall (fun face => forall variable, polynomial_degree (face variable) <= 1) faces -> polynomial_degree (face_sum polynomial faces) <= polynomial_degree polynomial"
assumptions = []

[[witness.declarations]]
name = "ordinary_coboundary"
statement = "Definition ordinary_coboundary (left right input : Group) : bool := xorb (xorb (sign_cochain right input) (sign_cochain left (add right input))) (xorb (sign_cochain (add left right) input) (sign_cochain left right))"
assumptions = []

[[witness.declarations]]
name = "schreier_exponent"
statement = "Definition schreier_exponent (left right input : Group) : bool := xorb (xorb (sign_cochain right input) (sign_cochain left (add right input))) (sign_cochain (add left right) input)"
assumptions = []

[[witness.declarations]]
name = "normalized_schreier_is_coboundary"
statement = "Theorem normalized_schreier_is_coboundary : forall left right input, xorb (schreier_exponent left right input) (schreier_exponent left right identity) = ordinary_coboundary left right input"
assumptions = []

[[witness.declarations]]
name = "xor_group_face"
statement = "Definition xor_group_face (block_dimension arity face variable : nat) : boolean_polynomial := if Nat.eqb face 0 then PolynomialVariable (variable + block_dimension) else if Nat.leb face arity then let argument := variable / block_dimension in if Nat.ltb argument (face - 1) then PolynomialVariable variable else if Nat.eqb argument (face - 1) then PolynomialSum (PolynomialVariable variable) (PolynomialVariable (variable + block_dimension)) else PolynomialVariable (variable + block_dimension) else PolynomialVariable variable"
assumptions = []

[[witness.declarations]]
name = "xor_group_face_linear"
statement = "Theorem xor_group_face_linear : forall block_dimension arity face variable, polynomial_degree (xor_group_face block_dimension arity face variable) <= 1"
assumptions = []

[[witness.declarations]]
name = "xor_group_differential"
statement = "Definition xor_group_differential (block_dimension arity : nat) (polynomial : boolean_polynomial) : boolean_polynomial := face_sum polynomial (map (xor_group_face block_dimension arity) (seq 0 (arity + 2)))"
assumptions = []


[[witness.declarations]]
name = "gaussian_phase_variance"
statement = "Definition gaussian_phase_variance dimension covariance weights := quadratic_form dimension covariance weights weights"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "gaussian_coherence"
statement = "Definition gaussian_coherence (relaxation_exponent phase_variance : R) := exp (-relaxation_exponent - phase_variance / 2)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalDedekindReals.sig_not_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "psd_phase_variance_nonnegative"
statement = "Theorem psd_phase_variance_nonnegative : forall dimension covariance weights, form_psd dimension covariance -> 0 <= gaussian_phase_variance dimension covariance weights"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "exp_nonpositive_range"
statement = "Lemma exp_nonpositive_range : forall exponent, exponent <= 0 -> 0 < exp exponent <= 1"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalDedekindReals.sig_not_dec", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "gaussian_coherence_range"
statement = "Theorem gaussian_coherence_range : forall dimension covariance weights relaxation, form_psd dimension covariance -> 0 <= relaxation -> 0 < gaussian_coherence relaxation (gaussian_phase_variance dimension covariance weights) <= 1"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalDedekindReals.sig_not_dec", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "gaussian_variance_monotone_coherence"
statement = "Theorem gaussian_variance_monotone_coherence : forall relaxation first_variance second_variance, first_variance <= second_variance -> gaussian_coherence relaxation second_variance <= gaussian_coherence relaxation first_variance"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalDedekindReals.sig_not_dec", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]

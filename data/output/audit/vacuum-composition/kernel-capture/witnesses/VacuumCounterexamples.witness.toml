[[declarations]]
name = "complex_difference"
statement = "Definition complex_difference first second := complex_add first (complex_scale (-1) second)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[declarations]]
name = "complex_real_pair"
statement = "Definition complex_real_pair first second := cre first * cre second + cim first * cim second"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[declarations]]
name = "depolarizing_choi_form"
statement = "Definition depolarizing_choi_form parameter first second third fourth := ((1 + parameter) * (complex_norm_sq first + complex_norm_sq fourth) + (1 - parameter) * (complex_norm_sq second + complex_norm_sq third) + 4 * parameter * complex_real_pair first fourth) / 4"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "depolarizing_choi_psd"
statement = "Definition depolarizing_choi_psd parameter := forall first second third fourth, 0 <= depolarizing_choi_form parameter first second third fourth"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "depolarizing_choi_bell_decomposition"
statement = "Theorem depolarizing_choi_bell_decomposition : forall parameter first second third fourth, depolarizing_choi_form parameter first second third fourth = (1 + 3 * parameter) / 8 * complex_norm_sq (complex_add first fourth) + (1 - parameter) / 8 * complex_norm_sq (complex_difference first fourth) + (1 - parameter) / 4 * (complex_norm_sq second + complex_norm_sq third)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "depolarizing_choi_psd_interval"
statement = "Theorem depolarizing_choi_psd_interval : forall parameter, depolarizing_choi_psd parameter <-> -1/3 <= parameter <= 1"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "depolarizing_negative_half_witness"
statement = "Theorem depolarizing_negative_half_witness : depolarizing_choi_form (-1/2) complex_one complex_zero complex_zero complex_one = -1/4"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[declarations]]
name = "word"
statement = "Definition word := Index -> bool"
assumptions = []

[[declarations]]
name = "word_eq"
statement = "Definition word_eq (left right : word) := forall index, left index = right index"
assumptions = []

[[declarations]]
name = "word_add"
statement = "Definition word_add (left right : word) : word := fun index => xorb (left index) (right index)"
assumptions = []

[[declarations]]
name = "constant"
statement = "Definition constant (value : bool) : word := fun _ => value"
assumptions = []

[[declarations]]
name = "project"
statement = "Definition project (value : word) : word := word_add value (constant (value origin))"
assumptions = []

[[declarations]]
name = "projection_zero"
statement = "Theorem projection_zero : forall value, project value origin = false"
assumptions = []

[[declarations]]
name = "projection_linear"
statement = "Theorem projection_linear : forall left right, word_eq (project (word_add left right)) (word_add (project left) (project right))"
assumptions = []

[[declarations]]
name = "projection_idempotent"
statement = "Theorem projection_idempotent : forall value, word_eq (project (project value)) (project value)"
assumptions = []

[[declarations]]
name = "projection_kernel"
statement = "Theorem projection_kernel : forall value, word_eq (project value) (constant false) <-> word_eq value (constant (value origin))"
assumptions = []

[[declarations]]
name = "scalar_decomposition"
statement = "Theorem scalar_decomposition : forall value, word_eq value (word_add (project value) (constant (value origin)))"
assumptions = []

[[declarations]]
name = "scalar_decomposition_unique"
statement = "Theorem scalar_decomposition_unique : forall value normalized scalar, normalized origin = false -> word_eq value (word_add normalized (constant scalar)) -> scalar = value origin /\\ word_eq normalized (project value)"
assumptions = []

[[declarations]]
name = "projection_preserves_code"
statement = "Theorem projection_preserves_code : forall value, kernel_code value -> kernel_code (project value)"
assumptions = []

[[declarations]]
name = "projection_image"
statement = "Theorem projection_image : forall normalized, (exists value, kernel_code value /\\ word_eq (project value) normalized) <-> kernel_code normalized /\\ normalized origin = false"
assumptions = []

[[declarations]]
name = "code_direct_sum"
statement = "Theorem code_direct_sum : forall value, kernel_code value -> kernel_code (project value) /\\ project value origin = false /\\ word_eq value (word_add (project value) (constant (value origin))) /\\ (forall normalized scalar, normalized origin = false -> word_eq value (word_add normalized (constant scalar)) -> scalar = value origin /\\ word_eq normalized (project value))"
assumptions = []

[[declarations]]
name = "controlled_projection_exact"
statement = "Theorem controlled_projection_exact : forall control value scalar : bool, andb control value = xorb (andb control (xorb value scalar)) (andb control scalar)"
assumptions = []

[[declarations]]
name = "controlled_scalar_distinguishable"
statement = "Theorem controlled_scalar_distinguishable : andb false false = andb false true /\\ andb true false <> andb true true"
assumptions = []

[[declarations]]
name = "scalar_pair"
statement = "Definition scalar_pair := (Qc * Qc)%type"
assumptions = []

[[declarations]]
name = "pair_zero"
statement = "Definition pair_zero : scalar_pair := (0, 0)"
assumptions = []

[[declarations]]
name = "pair_product"
statement = "Definition pair_product (left right : scalar_pair) : scalar_pair := (fst left * fst right - snd right * snd left, snd right * fst left + snd left * fst right)"
assumptions = []

[[declarations]]
name = "pair_average"
statement = "Definition pair_average (value : scalar_pair) : Qc := (fst value + snd value) / (1 + 1)"
assumptions = []

[[declarations]]
name = "pair_detail"
statement = "Definition pair_detail (value : scalar_pair) : Qc := (fst value - snd value) / (1 + 1)"
assumptions = []

[[declarations]]
name = "average_detail"
statement = "Definition average_detail (value : scalar_pair) : scalar_pair := (pair_average value, pair_detail value)"
assumptions = []

[[declarations]]
name = "reconstruct"
statement = "Definition reconstruct (coordinates : scalar_pair) : scalar_pair := (fst coordinates + snd coordinates, fst coordinates - snd coordinates)"
assumptions = []

[[declarations]]
name = "kernel_witness"
statement = "Definition kernel_witness : scalar_pair := (1, Qcopp 1)"
assumptions = []

[[declarations]]
name = "right_multiplier"
statement = "Definition right_multiplier : scalar_pair := (0, 1)"
assumptions = []

[[declarations]]
name = "kernel_witness_average"
statement = "Lemma kernel_witness_average : pair_average kernel_witness = 0"
assumptions = []

[[declarations]]
name = "zero_average"
statement = "Lemma zero_average : pair_average pair_zero = 0"
assumptions = []

[[declarations]]
name = "witness_product_average"
statement = "Lemma witness_product_average : pair_average (pair_product kernel_witness right_multiplier) = 1"
assumptions = []

[[declarations]]
name = "zero_product_average"
statement = "Lemma zero_product_average : pair_average (pair_product pair_zero right_multiplier) = 0"
assumptions = []

[[declarations]]
name = "average_product_does_not_descend"
statement = "Theorem average_product_does_not_descend : ~ exists average_product : Qc -> Qc -> Qc, forall left right : scalar_pair, pair_average (pair_product left right) = average_product (pair_average left) (pair_average right)"
assumptions = []

[[declarations]]
name = "reconstruction_after_average_detail"
statement = "Theorem reconstruction_after_average_detail : forall value, reconstruct (average_detail value) = value"
assumptions = []

[[declarations]]
name = "average_detail_after_reconstruction"
statement = "Theorem average_detail_after_reconstruction : forall coordinates, average_detail (reconstruct coordinates) = coordinates"
assumptions = []

[[declarations]]
name = "average_detail_injective"
statement = "Theorem average_detail_injective : forall left right, average_detail left = average_detail right -> left = right"
assumptions = []

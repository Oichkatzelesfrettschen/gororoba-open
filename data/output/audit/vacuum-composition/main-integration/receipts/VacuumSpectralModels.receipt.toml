[[witness.declarations]]
name = "absorption_line"
statement = "Definition absorption_line coefficient occupation := coefficient * (occupation + 1)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "emission_line"
statement = "Definition emission_line coefficient occupation := coefficient * occupation"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "vacuum_ordered_line_asymmetry"
statement = "Theorem vacuum_ordered_line_asymmetry : forall coefficient, 0 < coefficient -> emission_line coefficient 0 = 0 /\\ absorption_line coefficient 0 > 0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "oscillator_variance_survives_zero_occupation"
statement = "Theorem oscillator_variance_survives_zero_occupation : forall coefficient, 0 < coefficient -> absorption_line coefficient 0 + emission_line coefficient 0 = coefficient /\\ coefficient > 0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "ordered_lines_obey_bose_balance"
statement = "Theorem ordered_lines_obey_bose_balance : forall coefficient inverse_temperature_frequency, 0 < inverse_temperature_frequency -> absorption_line coefficient (/ (exp inverse_temperature_frequency - 1)) = exp inverse_temperature_frequency * emission_line coefficient (/ (exp inverse_temperature_frequency - 1))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalDedekindReals.sig_not_dec", "Classical_Prop.classic", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "harmonic_zero_point_variance"
statement = "Definition harmonic_zero_point_variance hbar mass stiffness := hbar / (2 * sqrt (mass * stiffness))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalDedekindReals.sig_not_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "harmonic_variance_positive"
statement = "Theorem harmonic_variance_positive : forall hbar mass stiffness, 0 < hbar -> 0 < mass -> 0 < stiffness -> 0 < harmonic_zero_point_variance hbar mass stiffness"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalDedekindReals.sig_not_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "stable_softening_increases_zero_point_variance"
statement = "Theorem stable_softening_increases_zero_point_variance : forall hbar mass softer stiffer, 0 < hbar -> 0 < mass -> 0 < softer -> softer < stiffer -> harmonic_zero_point_variance hbar mass stiffer < harmonic_zero_point_variance hbar mass softer"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "ClassicalDedekindReals.sig_not_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "stable_softening_increases_classical_thermal_variance"
statement = "Theorem stable_softening_increases_classical_thermal_variance : forall temperature_scale softer stiffer, 0 < temperature_scale -> 0 < softer -> softer < stiffer -> temperature_scale / stiffer < temperature_scale / softer"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]

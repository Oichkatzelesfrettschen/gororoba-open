[[witness.declarations]]
name = "rank_certificate_check"
statement = "Definition rank_certificate_check rows columns rank (operator : matrix.matrix scalar rows columns) (upper_left : matrix.matrix scalar rows rank) (upper_right : matrix.matrix scalar rank columns) (lower_left : matrix.matrix scalar rank rows) (lower_right : matrix.matrix scalar columns rank) := andb (eqtype.eq_op operator (matrix.mulmx upper_left upper_right)) (eqtype.eq_op (matrix.mulmx (matrix.mulmx lower_left operator) lower_right) (matrix.scalar_mx (@rings_modules_and_algebras.GRing.one scalar)))"
assumptions = []

[[witness.declarations]]
name = "rank_certificate_check_sound"
statement = "Theorem rank_certificate_check_sound rows columns rank (operator : matrix.matrix scalar rows columns) (upper_left : matrix.matrix scalar rows rank) (upper_right : matrix.matrix scalar rank columns) (lower_left : matrix.matrix scalar rank rows) (lower_right : matrix.matrix scalar columns rank) : rank_certificate_check operator upper_left upper_right lower_left lower_right = true -> mxalgebra.mxrank operator = rank"
assumptions = []

[[witness.declarations]]
name = "full_dimension_column_kernel"
statement = "Theorem full_dimension_column_kernel rows columns width (operator : matrix.matrix scalar rows columns) (frame : matrix.matrix scalar columns width) : matrix.mulmx operator frame = matrix_zero scalar rows width -> mxalgebra.mxrank frame = ssrnat.subn columns (mxalgebra.mxrank operator) -> forall vector : matrix.matrix scalar columns 1, matrix.mulmx operator vector = matrix_zero scalar rows 1 -> exists coefficients : matrix.matrix scalar width 1, vector = matrix.mulmx frame coefficients"
assumptions = []

[[witness.declarations]]
name = "kernel_frame_check"
statement = "Definition kernel_frame_check rows columns width rank (operator : matrix.matrix scalar rows columns) (frame : matrix.matrix scalar columns width) (left_inverse : matrix.matrix scalar width columns) := andb (eqtype.eq_op (matrix.mulmx operator frame) (matrix_zero scalar rows width)) (andb (eqtype.eq_op (matrix.mulmx left_inverse frame) (matrix.scalar_mx (@rings_modules_and_algebras.GRing.one scalar))) (Nat.eqb width (ssrnat.subn columns rank)))"
assumptions = []

[[witness.declarations]]
name = "checked_kernel_frame_complete"
statement = "Theorem checked_kernel_frame_complete rows columns width rank (operator : matrix.matrix scalar rows columns) (frame : matrix.matrix scalar columns width) (left_inverse : matrix.matrix scalar width columns) : mxalgebra.mxrank operator = rank -> kernel_frame_check rank operator frame left_inverse = true -> forall vector : matrix.matrix scalar columns 1, matrix.mulmx operator vector = matrix_zero scalar rows 1 -> exists coefficients : matrix.matrix scalar width 1, vector = matrix.mulmx frame coefficients"
assumptions = []


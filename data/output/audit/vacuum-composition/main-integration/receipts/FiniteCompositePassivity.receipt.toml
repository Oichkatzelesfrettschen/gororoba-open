[[witness.declarations]]
name = "joint_complex_state"
statement = "Definition joint_complex_state := nat -> complex_state"
assumptions = []

[[witness.declarations]]
name = "joint_norm"
statement = "Definition joint_norm first_dimension second_dimension (state : joint_complex_state) := finite_sum first_dimension (fun first => state_norm second_dimension (state first))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "joint_energy"
statement = "Definition joint_energy first_dimension second_dimension first_energies second_energies (state : joint_complex_state) := finite_sum first_dimension (fun first => spectral_energy second_dimension (fun second => first_energies first + second_energies second) (state first))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "joint_spectral_lower_bound"
statement = "Theorem joint_spectral_lower_bound : forall first_dimension second_dimension first_energies second_energies state first_ground second_ground, (forall index, (index < first_dimension)%nat -> first_ground <= first_energies index) -> (forall index, (index < second_dimension)%nat -> second_ground <= second_energies index) -> (first_ground + second_ground) * joint_norm first_dimension second_dimension state <= joint_energy first_dimension second_dimension first_energies second_energies state"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "normalized_joint_ground_bound"
statement = "Theorem normalized_joint_ground_bound : forall first_dimension second_dimension first_energies second_energies state first_ground second_ground, joint_norm first_dimension second_dimension state = 1 -> (forall index, (index < first_dimension)%nat -> first_ground <= first_energies index) -> (forall index, (index < second_dimension)%nat -> second_ground <= second_energies index) -> first_ground + second_ground <= joint_energy first_dimension second_dimension first_energies second_energies state"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "joint_ground_state_cyclic_passive"
statement = "Theorem joint_ground_state_cyclic_passive : forall first_dimension second_dimension first_energies second_energies initial final first_ground second_ground, joint_norm first_dimension second_dimension initial = 1 -> joint_norm first_dimension second_dimension final = joint_norm first_dimension second_dimension initial -> (forall index, (index < first_dimension)%nat -> first_ground <= first_energies index) -> (forall index, (index < second_dimension)%nat -> second_ground <= second_energies index) -> joint_energy first_dimension second_dimension first_energies second_energies initial = first_ground + second_ground -> joint_energy first_dimension second_dimension first_energies second_energies initial - joint_energy first_dimension second_dimension first_energies second_energies final <= 0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "correlated_two_level_state"
statement = "Definition correlated_two_level_state (first second : nat) : CDComplex := match first, second with | O, O => {| cre := 3/5; cim := 0 |} | S O, S O => {| cre := 4/5; cim := 0 |} | _, _ => complex_zero end"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "correlated_state_normalized"
statement = "Theorem correlated_state_normalized : joint_norm 2 2 correlated_two_level_state = 1"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "correlated_state_nonzero_minor"
statement = "Theorem correlated_state_nonzero_minor : cre (correlated_two_level_state 0 0) * cre (correlated_two_level_state 1 1) - cre (correlated_two_level_state 0 1) * cre (correlated_two_level_state 1 0) = 12/25"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "complex_product_minor_vanishes"
statement = "Lemma complex_product_minor_vanishes : forall first second third fourth, complex_mul (complex_mul first second) (complex_mul third fourth) = complex_mul (complex_mul first fourth) (complex_mul third second)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]

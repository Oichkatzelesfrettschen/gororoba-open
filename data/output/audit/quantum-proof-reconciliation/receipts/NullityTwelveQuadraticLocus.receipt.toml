[[witness.declarations]]
name = "quadratic_common_zero"
statement = "Definition quadratic_common_zero (z5 z6 z13 z16 z17 z18 z19 z20 : R) : Prop := z6^2-z16^2 = 0 /\\ z5*z6-z13*z16 = 0 /\\ z13*z6+z16*z5 = 0 /\\ z17*z5-z13*z20+z16*z17+z20*z6 = 0 /\\ z13*z19+z18*z5+z16*z18-z19*z6 = 0 /\\ z19*z5-z13*z18+z16*z19+z18*z6 = 0 /\\ z13*z17+z20*z5+z16*z20-z17*z6 = 0 /\\ z16*z6 = 0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "coordinate_plane_a15"
statement = "Definition coordinate_plane_a15 (z6 z16 z17 z18 z19 z20 : R) : Prop := z6=0 /\\ z16=0 /\\ z17=0 /\\ z18=0 /\\ z19=0 /\\ z20=0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "coordinate_plane_b17"
statement = "Definition coordinate_plane_b17 (z5 z6 z13 z16 : R) : Prop := z6=0 /\\ z16=0 /\\ z5=0 /\\ z13=0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "two_squares_zero_iff"
statement = "Lemma two_squares_zero_iff : forall first second : R, first^2+second^2=0 <-> first=0 /\\ second=0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "four_squares_zero_iff"
statement = "Lemma four_squares_zero_iff : forall first second third fourth : R, first^2+second^2+third^2+fourth^2=0 <-> first=0 /\\ second=0 /\\ third=0 /\\ fourth=0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "first_obstruction_norm_identity"
statement = "Theorem first_obstruction_norm_identity : forall z6 z16 : R, (z6^2-z16^2)^2+4*(z16*z6)^2=(z6^2+z16^2)^2"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "residual_obstruction_norm_identity"
statement = "Theorem residual_obstruction_norm_identity : forall z5 z13 z17 z18 z19 z20 : R, (z5*z17-z13*z20)^2+(z5*z18+z13*z19)^2+ (z5*z19-z13*z18)^2+(z5*z20+z13*z17)^2 = (z5^2+z13^2)*(z17^2+z18^2+z19^2+z20^2)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "selected_quadratic_zero_set"
statement = "Theorem selected_quadratic_zero_set : forall z5 z6 z13 z16 z17 z18 z19 z20, quadratic_common_zero z5 z6 z13 z16 z17 z18 z19 z20 <-> coordinate_plane_a15 z6 z16 z17 z18 z19 z20 \\/ coordinate_plane_b17 z5 z6 z13 z16"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "admitted_directions_fail_additive_closure"
statement = "Theorem admitted_directions_fail_additive_closure : quadratic_common_zero 1 0 0 0 0 0 0 0 /\\ quadratic_common_zero 0 0 0 0 1 0 0 0 /\\ ~ quadratic_common_zero 1 0 0 0 1 0 0 0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]


[[witness.declarations]]
name = "sed_average"
statement = "Definition sed_average (value : CDSed) : CDOct := oct_scale (1 / 2) (oct_add (sed_lo value) (sed_hi value))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_detail"
statement = "Definition sed_detail (value : CDSed) : CDOct := oct_scale (1 / 2) (oct_sub (sed_lo value) (sed_hi value))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold"
statement = "Definition sed_fold (value : CDSed) : CDSed := mkSed (sed_average value) (sed_detail value)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_unfold"
statement = "Definition sed_unfold (coordinates : CDSed) : CDSed := mkSed (oct_add (sed_lo coordinates) (sed_hi coordinates)) (oct_sub (sed_lo coordinates) (sed_hi coordinates))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "sed_unfold_after_fold"
statement = "Theorem sed_unfold_after_fold : forall value, sed_unfold (sed_fold value) = value"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_after_unfold"
statement = "Theorem sed_fold_after_unfold : forall coordinates, sed_fold (sed_unfold coordinates) = coordinates"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_injective"
statement = "Theorem sed_fold_injective : forall left right, sed_fold left = sed_fold right -> left = right"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_zero"
statement = "Lemma sed_fold_zero : sed_fold sed_zero = sed_zero"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_product"
statement = "Definition sed_fold_product (left right : CDSed) : CDSed := sed_fold (sed_mul (sed_unfold left) (sed_unfold right))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_product_transport"
statement = "Theorem sed_fold_product_transport : forall left right, sed_fold_product (sed_fold left) (sed_fold right) = sed_fold (sed_mul left right)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_product_zero_iff"
statement = "Theorem sed_fold_product_zero_iff : forall left right, sed_fold_product left right = sed_zero <-> sed_mul (sed_unfold left) (sed_unfold right) = sed_zero"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_preserves_and_reflects_zero_product"
statement = "Theorem sed_fold_preserves_and_reflects_zero_product : forall left right, sed_fold_product (sed_fold left) (sed_fold right) = sed_zero <-> sed_mul left right = sed_zero"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_fold_witness_product_zero"
statement = "Theorem sed_fold_witness_product_zero : sed_fold_product (sed_fold sed_zd_a) (sed_fold sed_zd_b) = sed_zero"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_average_witness_product"
statement = "Theorem sed_average_witness_product : oct_mul (sed_average sed_zd_a) (sed_average sed_zd_b) = oct_scale (1 / 2) (oct_e 5)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_average_witness_product_nonzero"
statement = "Theorem sed_average_witness_product_nonzero : oct_mul (sed_average sed_zd_a) (sed_average sed_zd_b) <> oct_zero"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sed_average_loses_zero_product"
statement = "Theorem sed_average_loses_zero_product : exists left right : CDSed, sed_mul left right = sed_zero /\\ oct_mul (sed_average left) (sed_average right) <> oct_zero"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

assumptions = []

[[witness.declarations]]
name = "projection_image"
statement = "Theorem projection_image : forall normalized, (exists value, kernel_code value /\\ word_eq (project value) normalized) <-> kernel_code normalized /\\ normalized origin = false"
assumptions = []

[[witness.declarations]]
name = "code_direct_sum"

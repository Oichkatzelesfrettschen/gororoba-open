[[witness.declarations]]
name = "word"
statement = "Definition word := Index -> bool"
assumptions = []

[[witness.declarations]]
name = "word_eq"
statement = "Definition word_eq (left right : word) := forall index, left index = right index"
assumptions = []

[[witness.declarations]]
name = "word_add"
statement = "Definition word_add (left right : word) : word := fun index => xorb (left index) (right index)"
assumptions = []

[[witness.declarations]]
name = "constant"
statement = "Definition constant (value : bool) : word := fun _ => value"
assumptions = []

[[witness.declarations]]
name = "project"
statement = "Definition project (value : word) : word := word_add value (constant (value origin))"
assumptions = []

[[witness.declarations]]
name = "projection_zero"
statement = "Theorem projection_zero : forall value, project value origin = false"
assumptions = []

[[witness.declarations]]
name = "projection_linear"
statement = "Theorem projection_linear : forall left right, word_eq (project (word_add left right)) (word_add (project left) (project right))"
assumptions = []

[[witness.declarations]]
name = "projection_idempotent"
statement = "Theorem projection_idempotent : forall value, word_eq (project (project value)) (project value)"
assumptions = []

[[witness.declarations]]
name = "projection_kernel"
statement = "Theorem projection_kernel : forall value, word_eq (project value) (constant false) <-> word_eq value (constant (value origin))"
assumptions = []

[[witness.declarations]]
name = "scalar_decomposition"
statement = "Theorem scalar_decomposition : forall value, word_eq value (word_add (project value) (constant (value origin)))"
assumptions = []

[[witness.declarations]]
name = "scalar_decomposition_unique"
statement = "Theorem scalar_decomposition_unique : forall value normalized scalar, normalized origin = false -> word_eq value (word_add normalized (constant scalar)) -> scalar = value origin /\\ word_eq normalized (project value)"
assumptions = []

[[witness.declarations]]
name = "projection_preserves_code"

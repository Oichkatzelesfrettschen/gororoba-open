[[witness.declarations]]
name = "sedenion_d2"
statement = "Definition sedenion_d2 (scalar_left scalar_right norm_left norm_right inner : R) : R := let scalar_norm := scalar_left^2 + scalar_right^2 in scalar_norm^2 + 2 * scalar_norm * (norm_left + norm_right) + (norm_left - norm_right)^2 + 4 * inner^2"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "sedenion_d2_zero_iff"
statement = "Theorem sedenion_d2_zero_iff : forall scalar_left scalar_right norm_left norm_right inner, 0 <= norm_left -> 0 <= norm_right -> (sedenion_d2 scalar_left scalar_right norm_left norm_right inner = 0 <-> scalar_left = 0 /\\ scalar_right = 0 /\\ norm_left = norm_right /\\ inner = 0)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "sedenion_d2_gradient"
statement = "Definition sedenion_d2_gradient (scalar_left scalar_right norm_left norm_right inner : R) : R * R * R * R * R := let total := scalar_left^2 + scalar_right^2 + norm_left + norm_right in (4 * scalar_left * total, 4 * scalar_right * total, 2 * (scalar_left^2 + scalar_right^2) + 2 * (norm_left - norm_right), 2 * (scalar_left^2 + scalar_right^2) - 2 * (norm_left - norm_right), 8 * inner)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "sedenion_d2_gradient_vanishes"
statement = "Theorem sedenion_d2_gradient_vanishes : forall norm, sedenion_d2_gradient 0 0 norm norm 0 = (0, 0, 0, 0, 0)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "membership_sed_scale"
statement = "Definition membership_sed_scale (factor : R) (value : CDSed) : CDSed := mkSed (mkOct (quat_scale factor (oct_lo (sed_lo value))) (quat_scale factor (oct_hi (sed_lo value)))) (mkOct (quat_scale factor (oct_lo (sed_hi value))) (quat_scale factor (oct_hi (sed_hi value))))"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "parallel_imaginary_halves"
statement = "Definition parallel_imaginary_halves : CDSed := mkSed (oct_e 1) (oct_e 1)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "scalar_and_imaginary_halves"
statement = "Definition scalar_and_imaginary_halves : CDSed := mkSed (oct_e 0) (oct_e 1)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "scalar_and_imaginary_left_inverse"
statement = "Definition scalar_and_imaginary_left_inverse : CDSed := mkSed (oct_e 0) (mkOct (mkQuat 0 (-1) 0 0) quat_zero)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "parallel_halves_left_square"
statement = "Theorem parallel_halves_left_square : forall value, sed_mul parallel_imaginary_halves (sed_mul parallel_imaginary_halves value) = membership_sed_scale (-2) value"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "scalar_halves_left_inverse"

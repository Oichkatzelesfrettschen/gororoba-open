[[implementation_edge]]
claim = "C-1342"
claim_sentence = "The number of motif components (box-kite generalizations) at CD dimension D is n_components = D/2 - 1, each containing D/2 - 2 cross-assessor nodes. Total cross-assessors = (D/2-1)(D/2-2). Verified computationally at D=16 (7*6=42), D=32 (15*14=210), D=64 (31*30=930), and analytically to D=4096."
implementation_file = "crates/algebra_analysis/tests/motif_exact_rank.rs"
implementation_scope = "The test enumerates motif_components_for_cross_assessors(D) for D in 16, 32, 64, 128 and 256, asserts that each component has D/2 - 2 vertices and that the rational rank of each component adjacency matrix equals the number of its distinct columns, and writes the report. The report header records universal_extension = unproved."
measured_components = "D=16: 7; D=32: 15; D=64: 31; D=128: 63; D=256: 127 (components = D/2 - 1 in all five dimensions)"
measured_active_motif_nodes = "42; 210; 930; 3906; 16002 (components times D/2 - 2). These are the active motif nodes that survive in the components; cross_assessors(D) returns (D/2 - 1)(D/2) pairs and motif_components_for_nodes drops nodes without a diagonal zero-product edge."
successor_state = "The finite statement holds in the existing Provisional claim C-1715 (components 7, 15, 31, 63, 127; D/2 - 2 vertices each; evidence data/output/audit/claim-family-evidence-adjudication/motif-exact-rank.toml). The transition tooling registers a relation only to a claim it creates, so the transition names C-1715 in its rationale."
not_stated = ["The component count D/2 - 1 is read from the report and is not an assertion of the test.", "No test, source or document in the repository derives the formulas analytically, and none enumerates a dimension above 256; the clause 'analytically to D=4096' has no cited support.", "The where_stated of C-1342 cites a test function by a name that no repository file holds; the enumeration that exists is the test motif_exact_rank (every_enumerated_motif_has_certified_rational_rank)."]

[[implementation_edge]]
claim = "C-168"
claim_sentence = "ZD product spectrum at dim=128: among the first 100 diagonal-form (e_i+e_j)/sqrt(2) candidates, ZERO are actual zero divisors. This suggests the ZD structure becomes dramatically sparser at dim=128, or requires different index pairs."
clauses = ["1a observation: 0 of the first 100 candidates are zero divisors. Untested: cd_algebraic_experiments_v20.py and its JSON are absent from the history of this repository, and the ordering is unstated.", "1b inference: the structure becomes dramatically sparser at 128D. Falsified by the census below.", "1c inference: zero divisors need other index pairs. Consistent with the census; untested."]
census_definition = "tower_census.py computes, for each doubly pure element y with coordinates in {-1, 0, 1} (coordinates 0 and D/2 zero), the nullity D - rank over Z of the left-multiplication matrix L_y built from cd_sign of gororoba-quantum (gororoba_quantum/cd_core.py). Nullity above 0 means y z = 0 for some nonzero z, so y is a zero divisor. Elements y and -y have the same nullity and are both counted."
census_128d = "census.json, key 128, support 2: 27768 of 31500 signed two-term elements have nonzero nullity (keys 2:4 to 2:60) and 3732 have nullity 0 (key 2:0). recount.json counts unordered pairs: 6942 of the 7875 plus-sign pairs e_i + e_j have nonzero nullity, and the 6942 minus-sign pairs e_i - e_j are the same pairs (pairs_with_differing_sign_nullity 0); 4 x 6942 = 27768."
density_by_dimension = "recount.json, unordered plus-sign pairs with nonzero nullity over all pairs: 16D 42/91, 32D 294/435, 64D 1518/1891, 128D 6942/7875 (46.15, 67.59, 80.27 and 88.15 percent); census.json signed counts 168/364, 1176/1740, 6072/7564, 27768/31500."
cross_half_check = "The 64D cross-half operands e_a + e_(32+b), a and b in 1..31, were recomputed with exact matrix rank of L_y (cd_sign of gororoba-quantum, numpy matrix_rank, 64 by 64 integer matrices): nullities 28, 20, 12, 4, 0 on 342, 168, 168, 252, 31 pairs, 930 of 961 nonzero. The counts agree with row T082 of the gororoba-math tower audit (local, untracked) and with census.json at 64D (2:28 = 1368 = 4 x 342, 2:20 = 672 = 4 x 168, 2:12 = 672 = 4 x 168, 2:4 = 1008 = 4 x 252)."
ordering_computed = "recount.json at 128D, nullity of e_i + e_j: the first 100 pairs in lexicographic order starting at i = 0, (0,1) to (0,100), all have nullity 0; the 100 pairs (1,2) to (1,101) starting at i = 1 hold 86 with nonzero nullity and 14 with nullity 0 (j = 2 to 9, 16, 17, 32, 33, 64 and 65)."
ordering_caveat = "The ordering of the original script cd_algebraic_experiments_v20.py is unknown, and the script is absent from the history; the computed facts concern two named orderings only. hypothesis: the script iterated pairs from i = 0, which would give 0 of 100 because no element with a nonzero coordinate at e_0 or e_(D/2) is a zero divisor (successor 3)."
not_stated = ["The first 100 candidates of cd_algebraic_experiments_v20.py were not recomputed; the claim's observed count of zero is neither confirmed nor refuted.", "Nothing is claimed for a dimension above 128D.", "census.json and recount.json are retained outputs and were not rerun for this map."]


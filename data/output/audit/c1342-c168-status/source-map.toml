theorem = "CayleyDickson.Tower.re_halves_eq_zero_of_mk_mul_eq_zero"
theorem_scope = "For an ordered commutative ring R with trivial star and no zero divisors (hsq: every square nonnegative), when mk a b * mk c d = 0 with both factors nonzero, re a = re b = re c = re d = 0 (Lemma 9.5 of Biss, Dugger and Isaksen). In Tower R (k+1) the coordinate of 1 is re a and the coordinate of the adjoined unit is re b, so a zero divisor has zero coordinates at e_0 and e_(D/2)."

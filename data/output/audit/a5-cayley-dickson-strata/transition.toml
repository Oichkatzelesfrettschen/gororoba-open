[[successor]]
proposal_key = "a5-zero-divisor-strata-classification"
statement = "In the 32-dimensional Cayley-Dickson algebra A5, the zero divisors are the doubly pure y = (p, q) with Q G = 0 for z = p + i q, a union of two absolutely irreducible hypersurfaces of C^15 of complex dimension 14. The real nullity of L_y equals 28 - 2 rank_C C_z, so the nullities 4, 8, 12, 16 are the rank 12, 10, 8, 6 loci of C_z. The rank strata have closed equations R_8 = W8 u E8-bar, R_12 = V u B9, R_16 = N_+ u N_-; E8-bar is irreducible of complex dimension 11 with projective degree 24. The unit strata of nullity 4 and 12 are connected and those of nullity 8 and 16 have two connected components."
initial_status = "Verified"
source_or_implementation_boundary = "gororoba-quantum claims a5-zero-divisor-strata and a5-rank-strata-equations at the commit and file digests of data/output/audit/a5-cayley-dickson-strata/source-binding.toml; written proofs, Groebner membership and radical certificates, and an independent Singular re-derivation over Q."
required_falsifier = "A point of a stated stratum whose L_y nullity differs from 28 - 2 rank C_z, a principal Pfaffian of order 12, 10 or 8 outside the ideal of a piece of its stratum, or a third irreducible component of any rank stratum."

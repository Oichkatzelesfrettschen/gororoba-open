name = "census_phase_sum_input"
statement = "Lemma census_phase_sum_input : forall order (left middle : cube order), associator_phase order left middle (cube_xor order left middle) = false"
assumptions = []

[[declarations]]
name = "dependent_basis_triple"
statement = "Definition dependent_basis_triple order (left middle right : cube order) : Prop := left = cube_zero order \\/ middle = cube_zero order \\/ right = cube_zero order \\/ left = middle \\/ left = right \\/ middle = right \\/ cube_xor order left middle = right"
assumptions = []

[[declarations]]
name = "dependent_basis_triple_associates"
statement = "Theorem dependent_basis_triple_associates : forall order (left middle right : cube order), dependent_basis_triple order left middle right -> associator_phase order left middle right = false"
assumptions = []

[[declarations]]
name = "census_lifting_vector"
statement = "Definition census_lifting_vector order (left middle right : cube order) : bool * bool * bool := (pair_coefficient order middle right, xorb (pair_coefficient order left middle) (pair_coefficient order left (cube_xor order middle right)), pair_coefficient order left middle)"
assumptions = []

[[declarations]]
name = "census_zero_relation_classes"
statement = "Theorem census_zero_relation_classes : forall order (left middle right : cube order), census_lifting_vector order (cube_zero order) middle right = (pair_coefficient order middle right, false, false) /\\ census_lifting_vector order left (cube_zero order) right = (false, pair_coefficient order left right, false) /\\ census_lifting_vector order left middle (cube_zero order) = (false, false, pair_coefficient order left middle)"
assumptions = []

[[declarations]]
name = "census_repeated_relation_classes"
statement = "Theorem census_repeated_relation_classes : forall order (left middle : cube order), census_lifting_vector order left left middle = (pair_coefficient order left middle, pair_coefficient order left middle, false) /\\ census_lifting_vector order left middle left = (pair_coefficient order left middle, false, pair_coefficient order left middle) /\\ census_lifting_vector order left middle middle = (false, pair_coefficient order left middle, pair_coefficient order left middle) /\\ census_lifting_vector order left middle (cube_xor order left middle) = (pair_coefficient order left middle, pair_coefficient order left middle, pair_coefficient order left middle)"
assumptions = []

[[declarations]]
name = "census_independent_relation_class"
statement = "Theorem census_independent_relation_class : forall order (left middle right : cube order), ~ dependent_basis_triple order left middle right -> census_lifting_vector order left middle right = (true, false, true)"
assumptions = []

[[declarations]]
name = "census_thin_relation_class"
statement = "Theorem census_thin_relation_class : forall order (left middle right : cube order), thin_triple order left middle right = true <-> census_lifting_vector order left middle right = (false, false, false)"
assumptions = []

name = "census_phase_zero_input"
statement = "Lemma census_phase_zero_input : forall order (left middle : cube order), associator_phase order left middle (cube_zero order) = false"
assumptions = []

[[declarations]]
name = "census_phase_left_input"
statement = "Lemma census_phase_left_input : forall order (left middle : cube order), associator_phase order left middle left = false"
assumptions = []


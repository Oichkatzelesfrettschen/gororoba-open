assumptions = []

[[declarations]]
name = "census_sign_transpose"
statement = "Lemma census_sign_transpose : forall order (left right : cube order), sign_exponent order right left = xorb (sign_exponent order left right) (pair_coefficient order left right)"
assumptions = []


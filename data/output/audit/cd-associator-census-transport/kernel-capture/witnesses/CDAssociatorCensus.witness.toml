[[declarations]]
name = "census_pair_zero_left"
statement = "Lemma census_pair_zero_left : forall order (value : cube order), pair_coefficient order (cube_zero order) value = false"
assumptions = []

[[declarations]]
name = "census_pair_zero_right"
statement = "Lemma census_pair_zero_right : forall order (value : cube order), pair_coefficient order value (cube_zero order) = false"
assumptions = []

[[declarations]]
name = "census_pair_diagonal"
statement = "Lemma census_pair_diagonal : forall order (value : cube order), pair_coefficient order value value = false"
assumptions = []

[[declarations]]
name = "census_pair_false"
statement = "Lemma census_pair_false : forall order (left right : cube order), pair_coefficient order left right = false <-> left = cube_zero order \\/ right = cube_zero order \\/ left = right"
assumptions = []

[[declarations]]
name = "census_pair_translate"
statement = "Lemma census_pair_translate : forall order (left right : cube order), pair_coefficient order left (cube_xor order left right) = pair_coefficient order left right"
assumptions = []

[[declarations]]
name = "thin_triple"
statement = "Definition thin_triple order (left middle right : cube order) := negb (orb (pair_coefficient order left middle) (orb (pair_coefficient order left right) (pair_coefficient order middle right)))"
assumptions = []

[[declarations]]
name = "census_top_coefficients"
statement = "Lemma census_top_coefficients : forall order (left middle right : cube order), andb (negb (pair_coefficient order left middle)) (andb (negb (pair_coefficient order middle right)) (negb (xorb (pair_coefficient order left middle) (pair_coefficient order left (cube_xor order middle right))))) = thin_triple order left middle right"
assumptions = []

[[declarations]]
name = "census_top_bit_law"
statement = "Theorem census_top_bit_law : forall order (left middle right : cube order) low high top, associator_phase (S order) (left,low) (middle,high) (right,top) = xorb (associator_phase order left middle right) (xorb (andb low (pair_coefficient order middle right)) (xorb (andb high (xorb (pair_coefficient order left middle) (pair_coefficient order left (cube_xor order middle right)))) (andb top (pair_coefficient order left middle))))"
assumptions = []

[[declarations]]
name = "boolean_triple_sum"
statement = "Definition boolean_triple_sum (function : bool -> bool -> bool -> Z) : Z := (function false false false + function false false true + function false true false + function false true true + function true false false + function true false true + function true true false + function true true true)%Z"
assumptions = []

[[declarations]]
name = "census_boolean_character"
statement = "Lemma census_boolean_character : forall phase first second third, boolean_triple_sum (fun low high top => phase_sign (xorb phase (xorb (andb low first) (xorb (andb high second) (andb top third))))) = (if andb (negb first) (andb (negb second) (negb third)) then 8 * phase_sign phase else 0)%Z"
assumptions = []

[[declarations]]
name = "census_thin_associates"
statement = "Lemma census_thin_associates : forall order (left middle right : cube order), thin_triple order left middle right = true -> associator_phase order left middle right = false"
assumptions = []

[[declarations]]
name = "census_top_bit_cancellation"
statement = "Theorem census_top_bit_cancellation : forall order (left middle right : cube order), boolean_triple_sum (fun low high top => phase_sign (associator_phase (S order) (left,low) (middle,high) (right,top))) = (if thin_triple order left middle right then 8 else 0)%Z"
assumptions = []

[[declarations]]
name = "census_delta"
statement = "Definition census_delta order (target input : cube order) : Z := if cube_equal order input target then 1 else 0"
assumptions = []

[[declarations]]
name = "census_delta_sum"
statement = "Lemma census_delta_sum : forall order (target : cube order), integer_cube_sum order (census_delta order target) = 1"
assumptions = []

[[declarations]]
name = "census_sum_single_exception"
statement = "Lemma census_sum_single_exception : forall order (target : cube order) ordinary exceptional, integer_cube_sum order (fun input => if cube_equal order input target then exceptional else ordinary) = Z.of_nat (Nat.pow 2 order) * ordinary + (exceptional - ordinary)"
assumptions = []

[[declarations]]
name = "census_pair_zero_mask"
statement = "Lemma census_pair_zero_mask : forall order (left input : cube order), cube_nonzero order left = true -> (if pair_coefficient order left input then 0 else 1) = census_delta order (cube_zero order) input + census_delta order left input"
assumptions = []

[[declarations]]
name = "census_pair_zero_count"
statement = "Lemma census_pair_zero_count : forall order (left : cube order), integer_cube_sum order (fun input => if pair_coefficient order left input then 0 else 1) = if cube_nonzero order left then 2 else Z.of_nat (Nat.pow 2 order)"
assumptions = []

[[declarations]]
name = "census_thin_inner"
statement = "Lemma census_thin_inner : forall order (left middle right : cube order), thin_triple order left middle right = if pair_coefficient order left middle then false else if cube_nonzero order left then negb (pair_coefficient order left right) else negb (pair_coefficient order middle right)"
assumptions = []

[[declarations]]
name = "census_thin_completion_count"
statement = "Lemma census_thin_completion_count : forall order (left middle : cube order), integer_cube_sum order (fun right => if thin_triple order left middle right then 1 else 0) = if pair_coefficient order left middle then 0 else if cube_nonzero order left then 2 else if cube_nonzero order middle then 2 else Z.of_nat (Nat.pow 2 order)"
assumptions = []

[[declarations]]
name = "census_thin_pair_count"
statement = "Lemma census_thin_pair_count : forall order (left : cube order), integer_cube_sum order (fun middle => integer_cube_sum order (fun right => if thin_triple order left middle right then 1 else 0)) = if cube_nonzero order left then 4 else 3 * Z.of_nat (Nat.pow 2 order) - 2"
assumptions = []

[[declarations]]
name = "census_triple_sum"
statement = "Definition census_triple_sum order (function : cube order -> cube order -> cube order -> Z) := integer_cube_sum order (fun left => integer_cube_sum order (fun middle => integer_cube_sum order (fun right => function left middle right)))"
assumptions = []

[[declarations]]
name = "census_thin_triple_count"
statement = "Theorem census_thin_triple_count : forall order, census_triple_sum order (fun left middle right => if thin_triple order left middle right then 1 else 0) = 7 * Z.of_nat (Nat.pow 2 order) - 6"
assumptions = []

[[declarations]]
name = "census_triple_slices"
statement = "Lemma census_triple_slices : forall order function, census_triple_sum (S order) function = census_triple_sum order (fun left middle right => boolean_triple_sum (fun low high top => function (left,low) (middle,high) (right,top)))"
assumptions = []

[[declarations]]
name = "census_triple_scale"
statement = "Lemma census_triple_scale : forall order factor function, census_triple_sum order (fun left middle right => factor * function left middle right) = factor * census_triple_sum order function"
assumptions = []

[[declarations]]
name = "census_total_phase_sum"
statement = "Theorem census_total_phase_sum : forall order, census_triple_sum (S order) (fun left middle right => phase_sign (associator_phase (S order) left middle right)) = 8 * (7 * Z.of_nat (Nat.pow 2 order) - 6)"
assumptions = []

[[declarations]]
name = "census_triple_add"
statement = "Lemma census_triple_add : forall order first second, census_triple_sum order (fun left middle right => first left middle right + second left middle right) = census_triple_sum order first + census_triple_sum order second"
assumptions = []

[[declarations]]
name = "census_triple_constant"
statement = "Lemma census_triple_constant : forall order value, census_triple_sum order (fun _ _ _ => value) = Z.of_nat (Nat.pow 2 order) ^ 3 * value"
assumptions = []

[[declarations]]
name = "associator_defect_count"
statement = "Definition associator_defect_count order : Z := census_triple_sum order (fun left middle right => if associator_phase order left middle right then 1 else 0)"
assumptions = []

[[declarations]]
name = "census_phase_count_identity"
statement = "Lemma census_phase_count_identity : forall order, census_triple_sum order (fun left middle right => phase_sign (associator_phase order left middle right)) = Z.of_nat (Nat.pow 2 order) ^ 3 - 2 * associator_defect_count order"
assumptions = []

[[declarations]]
name = "associator_census_integrality"
statement = "Theorem associator_census_integrality : forall order, 2 * associator_defect_count (S order) = (Z.of_nat (Nat.pow 2 (S order)) - 2) * (Z.of_nat (Nat.pow 2 (S order)) - 4) * (Z.of_nat (Nat.pow 2 (S order)) + 6)"
assumptions = []

[[declarations]]
name = "associator_census_formula"
statement = "Theorem associator_census_formula : forall order, associator_defect_count (S order) = ((Z.of_nat (Nat.pow 2 (S order)) - 2) * (Z.of_nat (Nat.pow 2 (S order)) - 4) * (Z.of_nat (Nat.pow 2 (S order)) + 6)) / 2"
assumptions = []

[[declarations]]
name = "numeric_associator_defect_count"
statement = "Definition numeric_associator_defect_count order := census_triple_sum order (fun left middle right => if Z.eqb (numeric_associator_sign order order (cube_encode order left) (cube_encode order middle) (cube_encode order right)) (-1) then 1 else 0)"
assumptions = []


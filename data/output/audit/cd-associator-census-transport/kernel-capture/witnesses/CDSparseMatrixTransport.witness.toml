[[declarations]]
name = "scalar_phase"
statement = "Definition scalar_phase (phase : bool) : scalar := if phase then nmodule.Algebra.opp (@rings_modules_and_algebras.GRing.one scalar) else @rings_modules_and_algebras.GRing.one scalar"
assumptions = []

[[declarations]]
name = "field_affine_supported"
statement = "Definition field_affine_supported (operand : cube order -> scalar) := forall input, same_coset order group input anchor = false -> operand input = nmodule.Algebra.zero"
assumptions = []

[[declarations]]
name = "sparse_field_entry"
statement = "Definition sparse_field_entry (operand : cube order -> scalar) (output input : cube order) : scalar := rings_modules_and_algebras.GRing.mul (operand (cube_xor order output input)) (scalar_phase (sign_exponent order (cube_xor order output input) input))"
assumptions = []

[[declarations]]
name = "sparse_field_cross_zero"
statement = "Lemma sparse_field_cross_zero operand output input : field_affine_supported operand -> same_coset order group output (cube_xor order anchor input) = false -> sparse_field_entry operand output input = nmodule.Algebra.zero"
assumptions = []

[[declarations]]
name = "sparse_field_matrix"
statement = "Definition sparse_field_matrix operand : matrix.matrix scalar (Nat.pow 2 order) (Nat.pow 2 order) := @matrix.matrix_of_fun scalar (Nat.pow 2 order) (Nat.pow 2 order) matrix.matrix_key (fun output input => sparse_field_entry operand (cube_decode order (fintype.nat_of_ord output)) (cube_decode order (fintype.nat_of_ord input)))"
assumptions = []

[[declarations]]
name = "sector_row_input"
statement = "Definition sector_row_input row := cube_decode order (fintype.nat_of_ord (row_map row))"
assumptions = []

[[declarations]]
name = "sector_column_input"
statement = "Definition sector_column_input column := cube_decode order (fintype.nat_of_ord (column_map column))"
assumptions = []

[[declarations]]
name = "row_sector_coordinates"
statement = "Definition row_sector_coordinates := (forall row : fintype.ordinal rows_left, same_coset order group (sector_row_input (@fintype.lshift rows_left rows_right row)) (cube_xor order anchor sector) = true) /\\ (forall row : fintype.ordinal rows_right, same_coset order group (sector_row_input (@fintype.rshift rows_left rows_right row)) (cube_xor order anchor sector) = false)"
assumptions = []

[[declarations]]
name = "column_sector_coordinates"
statement = "Definition column_sector_coordinates := (forall column : fintype.ordinal columns_left, same_coset order group (sector_column_input (@fintype.lshift columns_left columns_right column)) sector = true) /\\ (forall column : fintype.ordinal columns_right, same_coset order group (sector_column_input (@fintype.rshift columns_left columns_right column)) sector = false)"
assumptions = []

[[declarations]]
name = "sparse_field_upper_cross_zero"
statement = "Lemma sparse_field_upper_cross_zero operand : field_affine_supported operand -> row_sector_coordinates -> column_sector_coordinates -> matrix.ursubmx (matrix.mxsub row_map column_map (sparse_field_matrix operand)) = matrix_zero scalar rows_left columns_right"
assumptions = []

[[declarations]]
name = "sparse_field_lower_cross_zero"
statement = "Lemma sparse_field_lower_cross_zero operand : field_affine_supported operand -> row_sector_coordinates -> column_sector_coordinates -> matrix.dlsubmx (matrix.mxsub row_map column_map (sparse_field_matrix operand)) = matrix_zero scalar rows_right columns_left"
assumptions = []

[[declarations]]
name = "sparse_field_block_decomposition"
statement = "Theorem sparse_field_block_decomposition operand : field_affine_supported operand -> row_sector_coordinates -> column_sector_coordinates -> matrix.mxsub row_map column_map (sparse_field_matrix operand) = matrix.block_mx (matrix.ulsubmx (matrix.mxsub row_map column_map (sparse_field_matrix operand))) (matrix_zero scalar rows_left columns_right) (matrix_zero scalar rows_right columns_left) (matrix.drsubmx (matrix.mxsub row_map column_map (sparse_field_matrix operand)))"
assumptions = []

[[declarations]]
name = "sparse_field_rank_decomposition"
statement = "Theorem sparse_field_rank_decomposition operand (row_back : fintype.ordinal (Nat.pow 2 order) -> fintype.ordinal (ssrnat.addn rows_left rows_right)) (column_back : fintype.ordinal (Nat.pow 2 order) -> fintype.ordinal (ssrnat.addn columns_left columns_right)) : field_affine_supported operand -> row_sector_coordinates -> column_sector_coordinates -> (forall row, row_map (row_back row) = row) -> (forall column, column_map (column_back column) = column) -> mxalgebra.mxrank (sparse_field_matrix operand) = ssrnat.addn (mxalgebra.mxrank (matrix.ulsubmx (matrix.mxsub row_map column_map (sparse_field_matrix operand)))) (mxalgebra.mxrank (matrix.drsubmx (matrix.mxsub row_map column_map (sparse_field_matrix operand))))"
assumptions = []

[[witness.declarations]]
name = "weighted_expectation"
statement = "Definition weighted_expectation {A : Type} (law : list (A * R)) (observable : A -> R) : R := fold_right (fun point total => snd point * observable (fst point) + total) 0 law"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "nonnegative_law"
statement = "Definition nonnegative_law {A : Type} (law : list (A * R)) : Prop := Forall (fun point => 0 <= snd point) law"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "normalized_law"
statement = "Definition normalized_law {A : Type} (law : list (A * R)) : Prop := weighted_expectation law (fun _ => 1) = 1"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "indicator"
statement = "Definition indicator {A : Type} (event : A -> bool) (point : A) : R := if event point then 1 else 0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "event_probability"
statement = "Definition event_probability {A : Type} (law : list (A * R)) (event : A -> bool) : R := weighted_expectation law (indicator event)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "weighted_expectation_ext"
statement = "Lemma weighted_expectation_ext {A} (law : list (A * R)) f g : (forall point, f point = g point) -> weighted_expectation law f = weighted_expectation law g"
assumptions = ["ClassicalDedekindReals.sig_forall_dec"]

[[witness.declarations]]
name = "weighted_expectation_add"
statement = "Lemma weighted_expectation_add {A} (law : list (A * R)) f g : weighted_expectation law (fun point => f point + g point) = weighted_expectation law f + weighted_expectation law g"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "weighted_expectation_scale"
statement = "Lemma weighted_expectation_scale {A} (law : list (A * R)) scalar f : weighted_expectation law (fun point => scalar * f point) = scalar * weighted_expectation law f"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "weighted_expectation_zero"
statement = "Lemma weighted_expectation_zero {A} (law : list (A * R)) : weighted_expectation law (fun _ => 0) = 0"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "weighted_expectation_mono"
statement = "Lemma weighted_expectation_mono {A} (law : list (A * R)) f g : nonnegative_law law -> (forall point, f point <= g point) -> weighted_expectation law f <= weighted_expectation law g"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "weighted_expectation_nonnegative"
statement = "Lemma weighted_expectation_nonnegative {A} (law : list (A * R)) f : nonnegative_law law -> (forall point, 0 <= f point) -> 0 <= weighted_expectation law f"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "weighted_markov"
statement = "Lemma weighted_markov {A} (law : list (A * R)) event f threshold : nonnegative_law law -> 0 < threshold -> (forall point, 0 <= f point) -> (forall point, event point = true -> threshold <= f point) -> event_probability law event <= weighted_expectation law f / threshold"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "weighted_expectation_sum"
statement = "Lemma weighted_expectation_sum {A} (law : list (A * R)) {I : Type} (indices : list I) (observables : I -> A -> R) : weighted_expectation law (fun point => real_sum (map (fun index => observables index point) indices)) = real_sum (map (fun index => weighted_expectation law (observables index)) indices)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "indicator_union_bound"
statement = "Lemma indicator_union_bound {A I : Type} (indices : list I) (events : I -> A -> bool) point : indicator (fun sample => existsb (fun index => events index sample) indices) point <= real_sum (map (fun index => indicator (events index) point) indices)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "finite_union_bound"
statement = "Theorem finite_union_bound {A I : Type} (law : list (A * R)) (indices : list I) (events : I -> A -> bool) : nonnegative_law law -> event_probability law (fun point => existsb (fun index => events index point) indices) <= real_sum (map (fun index => event_probability law (events index)) indices)"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

[[witness.declarations]]
name = "event_probability_monotone"
statement = "Lemma event_probability_monotone {A : Type} (law : list (A * R)) (smaller larger : A -> bool) : nonnegative_law law -> (forall point, smaller point = true -> larger point = true) -> event_probability law smaller <= event_probability law larger"
assumptions = ["ClassicalDedekindReals.sig_forall_dec", "FunctionalExtensionality.functional_extensionality_dep"]

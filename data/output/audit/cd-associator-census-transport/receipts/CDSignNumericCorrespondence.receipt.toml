assumptions = []

[[witness.declarations]]
name = "cube_encode_high_xor"
statement = "Lemma cube_encode_high_xor : forall order (value : cube order) high, cube_encode (S order) (value, high) = Nat.lxor (cube_encode order value) (if high then 2 ^ order else 0)"
assumptions = []

[[witness.declarations]]
name = "cube_encode_xor"
statement = "Theorem cube_encode_xor : forall order (left right : cube order), cube_encode order (cube_xor order left right) = Nat.lxor (cube_encode order left) (cube_encode order right)"
assumptions = []

[[witness.declarations]]
name = "sign_diagonal"

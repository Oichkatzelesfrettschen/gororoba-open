assumptions = []

[[witness.declarations]]
name = "numeric_cube_sign"
statement = "Theorem numeric_cube_sign : forall order fuel (left right : cube order), order <= fuel -> M3IsAssociator.cd_sign_fuel fuel (2 ^ order) (cube_encode order left) (cube_encode order right) = phase_sign (sign_exponent order left right)"
assumptions = []

[[witness.declarations]]
name = "numeric_sign_fuel_irrelevant"
statement = "Theorem numeric_sign_fuel_irrelevant : forall order first second left right, order <= first -> order <= second -> left < 2 ^ order -> right < 2 ^ order -> M3IsAssociator.cd_sign_fuel first (2 ^ order) left right = M3IsAssociator.cd_sign_fuel second (2 ^ order) left right"
assumptions = []

[[witness.declarations]]
name = "numeric_associator_sign"
statement = "Definition numeric_associator_sign order fuel left middle right := (M3IsAssociator.cd_sign_fuel fuel (2 ^ order) middle right * M3IsAssociator.cd_sign_fuel fuel (2 ^ order) left (Nat.lxor middle right) * M3IsAssociator.cd_sign_fuel fuel (2 ^ order) (Nat.lxor left middle) right * M3IsAssociator.cd_sign_fuel fuel (2 ^ order) left middle)%Z"
assumptions = []

[[witness.declarations]]
name = "numeric_cube_associator"
statement = "Theorem numeric_cube_associator : forall order fuel (left middle right : cube order), order <= fuel -> numeric_associator_sign order fuel (cube_encode order left) (cube_encode order middle) (cube_encode order right) = phase_sign (associator_phase order left middle right)"
assumptions = []


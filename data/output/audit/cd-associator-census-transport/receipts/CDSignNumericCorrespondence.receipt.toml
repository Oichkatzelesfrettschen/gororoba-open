assumptions = []

[[witness.declarations]]
name = "cube_decode_encode"
statement = "Lemma cube_decode_encode : forall order (value : cube order), cube_decode order (cube_encode order value) = value"
assumptions = []

[[witness.declarations]]
name = "cube_encode_decode"
statement = "Lemma cube_encode_decode : forall order value, value < 2 ^ order -> cube_encode order (cube_decode order value) = value"
assumptions = []

[[witness.declarations]]
name = "cube_encode_injective"
statement = "Lemma cube_encode_injective : forall order (left right : cube order), cube_encode order left = cube_encode order right -> left = right"
assumptions = []

[[witness.declarations]]
name = "cube_encode_zero"
statement = "Lemma cube_encode_zero : forall order, cube_encode order (cube_zero order) = 0"
assumptions = []

[[witness.declarations]]
name = "cube_encode_zero_iff"
statement = "Lemma cube_encode_zero_iff : forall order (value : cube order), cube_encode order value = 0 <-> value = cube_zero order"
assumptions = []

[[witness.declarations]]
name = "cube_encode_nonzero"
statement = "Lemma cube_encode_nonzero : forall order (value : cube order), negb (Nat.eqb (cube_encode order value) 0) = cube_nonzero order value"
assumptions = []

[[witness.declarations]]
name = "bounded_land_high_zero"
